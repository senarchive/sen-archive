<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RESCENE ARCHIVE | MERCH</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@200;300;400;600;800;900&family=Noto+Sans+KR:wght@200;300;400;500;700&family=Plus+Jakarta+Sans:wght@300;400;500;700&family=Gaegu:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/index.css">
    <link rel="stylesheet" href="../css/modal.css">
    <link rel="stylesheet" href="goods.css">

    <script src="../js/theme-init.js"></script>
</head>
<body>
    <div id="siteNavSlot"></div>
    <script src="../js/layout.js"></script>
    <script>renderSiteNav('goods', '../', { calendar: true, lang: true });</script>

    <div id="mainWrapper" style="padding-top: 120px; min-height: 100vh; display: flex; flex-direction: column;">
        <div class="section-container goods-page-container reveal active" id="goodsTop" style="flex: 1;">
            <div class="section-header">
                <div class="section-title" data-i18n="merchTitle">OFFICIAL <span>MERCH</span></div>
                <div class="goods-subtitle">WITHMUU · KTOWN4U · KREAM 판매가/재고를 비교해서 모아봤습니다. 6시간마다 자동 갱신됩니다.</div>
            </div>

            <div class="goods-quick-cats" id="goodsQuickCats">
                <button type="button" class="goods-quick-btn active" data-cat="전체" onclick="goodsQuickCatClick(this,'전체')">
                    <span class="goods-quick-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg></span>
                    <span>전체</span>
                </button>
                <button type="button" class="goods-quick-btn" data-cat="앨범" onclick="goodsQuickCatClick(this,'앨범')">
                    <span class="goods-quick-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3"/></svg></span>
                    <span>앨범</span>
                </button>
                <button type="button" class="goods-quick-btn" data-cat="인형·키링" onclick="goodsQuickCatClick(this,'인형·키링')">
                    <span class="goods-quick-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="6" r="3"/><path d="M12 9v3"/><rect x="7" y="12" width="10" height="8" rx="2"/></svg></span>
                    <span>인형·키링</span>
                </button>
                <button type="button" class="goods-quick-btn" data-cat="응원봉" onclick="goodsQuickCatClick(this,'응원봉')">
                    <span class="goods-quick-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3 11.2V16h6v-1.8A6 6 0 0 0 12 3z"/></svg></span>
                    <span>응원봉</span>
                </button>
                <button type="button" class="goods-quick-btn" data-cat="콜라보 MD" onclick="goodsQuickCatClick(this,'콜라보 MD')">
                    <span class="goods-quick-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20.5 12.5L12.5 20.5a2 2 0 0 1-2.8 0l-6.2-6.2a2 2 0 0 1 0-2.8L11.5 3.5H19a1.5 1.5 0 0 1 1.5 1.5v7.5z"/><circle cx="15.3" cy="8.7" r="1.2" fill="currentColor" stroke="none"/></svg></span>
                    <span>콜라보 MD</span>
                </button>
                <button type="button" class="goods-quick-btn" data-cat="팬콘 MD" onclick="goodsQuickCatClick(this,'팬콘 MD')">
                    <span class="goods-quick-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v4"/></svg></span>
                    <span>팬콘 MD</span>
                </button>
                <button type="button" class="goods-quick-btn" data-cat="기타" onclick="goodsQuickCatClick(this,'기타')">
                    <span class="goods-quick-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 7l9-4 9 4-9 4-9-4z"/><path d="M3 7v10l9 4 9-4V7"/><path d="M12 11v10"/></svg></span>
                    <span>기타</span>
                </button>
            </div>

            <div class="goods-layout">
                <aside class="goods-sidebar" id="goodsSidebar"></aside>

                <div class="goods-main">
                    <div class="goods-toolbar">
                        <div id="goodsResultCount" class="goods-result-count">상품을 불러오는 중...</div>
                        <div class="goods-sort-tabs" id="goodsSortTabs">
                            <button type="button" class="goods-sort-btn active" data-sort="default" onclick="goodsSetSort('default')">인기순</button>
                            <button type="button" class="goods-sort-btn" data-sort="price-asc" onclick="goodsSetSort('price-asc')">낮은가격순</button>
                            <button type="button" class="goods-sort-btn" data-sort="price-desc" onclick="goodsSetSort('price-desc')">높은가격순</button>
                            <button type="button" class="goods-sort-btn" data-sort="stock" onclick="goodsSetSort('stock')">재고있는순</button>
                        </div>
                    </div>

                    <div class="goods-grid-v2" id="goodsGrid"></div>

                    <div id="goodsEndedToggle" class="goods-ended-toggle" style="display:none;"></div>
                </div>
            </div>

            <div class="stock-refresh-note">가격/재고 정보는 각 쇼핑몰 자동 수집 기준이며 실제와 다를 수 있습니다. 구매 전 반드시 판매처에서 최종 확인해 주세요.<br>해당 정보는 판매/중개 목적이 아니며, 각 링크를 통해 공식 판매처로 이동합니다.</div>
        </div>
        <div id="siteFooterSlot"></div>
        <script>renderSiteFooter('../');</script>
    </div>

    <script>
        var SITE_ROOT = '../';
    </script>
    <script src="../js/common.js"></script>
    <script src="goods.js"></script>

    <script>
        function goodsQuickCatClick(btn, cat) {
            if (typeof goodsSetCategory === 'function') goodsSetCategory(cat);
            document.querySelectorAll('.goods-quick-btn').forEach(b => b.classList.toggle('active', b === btn));
        }

        function goodsSyncQuickCatsFromSidebar() {
            const activeSidebarBtn = document.querySelector('#goodsSidebar .goods-cat-btn.active');
            if (!activeSidebarBtn) return;
            const cat = activeSidebarBtn.textContent.replace(/\s*\d+\s*$/, '').trim();
            document.querySelectorAll('.goods-quick-btn').forEach(b => b.classList.toggle('active', b.dataset.cat === cat));
        }

        document.addEventListener('DOMContentLoaded', () => {
            const sidebar = document.getElementById('goodsSidebar');
            if (sidebar) {
                new MutationObserver(goodsSyncQuickCatsFromSidebar).observe(sidebar, { childList: true, subtree: true });
            }
        });

        document.addEventListener('click', (e) => {
            if (e.target.closest('#goodsSidebar .goods-cat-btn')) {
                requestAnimationFrame(goodsSyncQuickCatsFromSidebar);
            }
        });
    </script>
</body>
</html>
