<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>리센느 연대기 10 · Magazine</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Pen+Script&family=Pinyon+Script&family=JetBrains+Mono:wght@400;700&family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap">
<style>*{box-sizing:border-box;margin:0;padding:0}html{-webkit-text-size-adjust:100%;overflow-x:hidden}body{overflow-x:clip;font-family:"Noto Sans KR",system-ui,sans-serif;word-break:keep-all;overflow-wrap:anywhere}img{max-width:100%}a{color:inherit}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
.mv{display:grid;grid-template-columns:86px 1fr 90px;gap:8px;align-items:center;font:700 12px "JetBrains Mono";margin:6px 0}.mv em{height:8px;display:block;background:#8883}.mv u{display:block;height:100%;width:var(--w);background:currentColor;animation:g 1.6s both}.mv b{text-align:right}@keyframes g{from{width:0}}.rk{width:100%;overflow:visible}.chartbox{max-width:560px;margin:14px 0}[data-r]{opacity:0;transition:.9s}[data-r].in{opacity:1}.cap{display:grid;gap:2px}.cap i{font:700 11px "JetBrains Mono";font-style:normal}.cap small{opacity:.7;font-size:12px}
:root{--k:#111;--r:#ff2a6d}
body{background:#fff;color:var(--k)}
.cover{min-height:100vh;position:relative;display:flex;flex-direction:column;justify-content:space-between;padding:16px;background:center/cover url(img/g_runaway.webp);color:#fff;overflow:hidden}
.cover::after{content:"";position:absolute;inset:0;background:linear-gradient(#0008,#0000 35%,#0009)}.cover>*{position:relative;z-index:2}
.cover h1{font:900 clamp(70px,26vw,320px)/.78 "Noto Sans KR";letter-spacing:-.09em;mix-blend-mode:normal;animation:tr 1.2s both}@keyframes tr{from{letter-spacing:.2em;opacity:0}}
.cover .bar{display:flex;justify-content:space-between;font:700 12px "JetBrains Mono";letter-spacing:.2em}.cover .li{font:900 clamp(18px,4vw,34px)/1.1 "Noto Sans KR";max-width:14ch}.cover .li em{display:block;font:400 clamp(30px,7vw,60px) "Pinyon Script";color:#ffd1e3;font-style:normal}
.sts{display:flex;overflow-x:auto;border-bottom:2px solid var(--k)}.st{flex:0 0 auto;padding:16px 22px;border-right:2px solid var(--k)}.st b{display:block;font:900 36px/1 "Noto Sans KR";color:var(--r)}.st span{font-size:12px;font-weight:700}
.ch{border-bottom:2px solid var(--k)}.ch .top{position:relative;min-height:70vh;display:flex;align-items:flex-end;background:center/cover;color:#fff}.ch .top::after{content:"";position:absolute;inset:0;background:linear-gradient(#0000 30%,#000b)}
.ch .top div{position:relative;z-index:2;padding:16px}.ch .top small{font:700 12px "JetBrains Mono";letter-spacing:.2em;color:#ffd1e3}.ch h2{font:900 clamp(48px,15vw,200px)/.85 "Noto Sans KR";letter-spacing:-.07em;text-transform:uppercase;transform:translateX(-4%);transition:1.2s cubic-bezier(.2,.8,.2,1);opacity:0}.ch.in h2{transform:none;opacity:1}
.body{max-width:960px;margin:0 auto;padding:26px 16px}.cp{font:900 clamp(24px,4.5vw,44px)/1.15 "Noto Sans KR";letter-spacing:-.03em;margin-bottom:16px}.cp::before{content:"“";color:var(--r)}
.cols{columns:1;column-gap:30px;line-height:1.8}@media(min-width:760px){.cols{columns:2}}.cols p{margin-bottom:10px;break-inside:avoid}
.ev{list-style:none;margin:16px 0;break-inside:avoid}.ev li{display:grid;grid-template-columns:92px 1fr;gap:8px;padding:7px 0;border-top:1px solid var(--k);font-size:14px}.ev b{font:700 11px "JetBrains Mono"}.ev .s{background:var(--r);color:#fff;padding:7px;margin:0 -7px}
.mv{color:var(--r)}.mv em{background:#0001}
.strip{display:flex;gap:10px;overflow-x:auto;padding:10px 0}.ph{flex:0 0 auto;width:min(42vw,180px)}.ph.mm{width:min(28vw,112px)}.ph img{display:block;width:100%;aspect-ratio:3/4;object-fit:cover}.ph figcaption{font:700 11px "JetBrains Mono";text-transform:uppercase;padding-top:4px}
.grp h3{margin-top:34px;font:900 clamp(34px,8vw,88px)/.9 "Noto Sans KR";letter-spacing:-.06em;text-transform:uppercase;border-top:8px solid var(--k);padding-top:8px}.grp h3 em{display:block;font:400 clamp(22px,4vw,36px) "Pinyon Script";color:var(--r);text-transform:none;letter-spacing:0}.lede{margin:8px 0 14px;font-weight:500}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:20px 14px}.card{display:block;text-decoration:none}.card .rc-th{aspect-ratio:3/4}.cap{padding-top:8px}.cap i{color:var(--r)}.cap b{font:900 17px/1.15 "Noto Sans KR";letter-spacing:-.02em}
.tg h4{font:900 20px "Noto Sans KR";margin:14px 0 6px}.tg span{display:inline-block;background:var(--k);color:#fff;padding:2px 10px;margin:0 5px 5px 0;font-size:13px}.sched{list-style:none}.sched li{display:grid;grid-template-columns:64px 1fr;padding:6px 0;border-top:1px solid var(--k);font-weight:700}.sched b{color:var(--r)}.chartbox{color:var(--r)}
footer{padding:30px 16px;font:700 11px "JetBrains Mono";text-align:center}
[data-r]{opacity:0;transition:.8s}[data-r].in{opacity:1}
</style></head><body><div id="app"></div>
<script src="rc.js"></script><script src="dx.js"></script><script>
const {R,story}=DX;
app.innerHTML=`<header class="cover"><div class="bar"><span>VOL.${R.sinceDebut}</span><span>REMINE EDITION</span></div><h1>RE<br>SCENE</h1><div class="li">잊혀지지 않는 향기<em>the scent issue</em></div></header><section class="sts">${DX.statsHTML()}</section>
${story.map(c=>`<article class="ch" data-r><div class="top" style="background-image:url(${R.img(c.group||c.cover)})"><div><small>${c.meta}</small><h2>${c.title}</h2></div></div><div class="body"><p class="cp">${c.caption}</p><div class="cols">${DX.body(c)}</div>${DX.mvbars(c)}${DX.ev(c)}${c.photos.length?`<div class="strip">${DX.ph(c)}</div>`:''}${DX.grp(c)}${DX.extra(c)}</div></article>`).join('')}<footer>${DX.foot}</footer>`;DX.boot();
</script></body></html>
