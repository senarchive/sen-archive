<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>리센느 연대기 08 · Minimal Light</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Pen+Script&family=Pinyon+Script&family=JetBrains+Mono:wght@400;700&family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap">
<style>*{box-sizing:border-box;margin:0;padding:0}html{-webkit-text-size-adjust:100%;overflow-x:hidden}body{overflow-x:clip;font-family:"Noto Sans KR",system-ui,sans-serif;word-break:keep-all;overflow-wrap:anywhere}img{max-width:100%}a{color:inherit}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
.mv{display:grid;grid-template-columns:86px 1fr 90px;gap:8px;align-items:center;font:700 12px "JetBrains Mono";margin:6px 0}.mv em{height:8px;display:block;background:#8883}.mv u{display:block;height:100%;width:var(--w);background:currentColor;animation:g 1.6s both}.mv b{text-align:right}@keyframes g{from{width:0}}.rk{width:100%;overflow:visible}.chartbox{max-width:560px;margin:14px 0}[data-r]{opacity:0;transition:.9s}[data-r].in{opacity:1}.cap{display:grid;gap:2px}.cap i{font:700 11px "JetBrains Mono";font-style:normal}.cap small{opacity:.7;font-size:12px}
body{background:#fff;color:#1d1d1f;letter-spacing:-.01em}
nav{position:sticky;top:0;z-index:5;background:#fffc;backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid #0002;height:46px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;font-size:13px;font-weight:500}nav b{font-weight:700}
.hero{text-align:center;padding:90px 16px 40px;background:linear-gradient(#fff,#f5f5f7)}
.hero h1{font:900 clamp(48px,13vw,150px)/1 "Noto Sans KR";letter-spacing:-.06em;background:linear-gradient(90deg,#ff5d8f,#8b5cf6,#2bb4ff);-webkit-background-clip:text;background-clip:text;color:transparent;animation:in 1.2s both}@keyframes in{from{opacity:0;transform:translateY(40px) scale(.95)}}
.hero p{font:500 clamp(18px,3vw,28px) "Noto Sans KR";color:#6e6e73;margin-top:14px}.hero .imgs{margin:40px auto 0;width:min(92%,900px);aspect-ratio:16/9;border-radius:28px;background:center/cover url(img/g_prettygirl.webp);box-shadow:0 30px 80px #0003;transform:scale(.9);transition:transform .2s}
.sts{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:900px;margin:28px auto}@media(min-width:760px){.sts{grid-template-columns:repeat(4,1fr)}}
.st{background:#fff;border-radius:22px;padding:18px;text-align:left;box-shadow:0 2px 20px #0001}.st b{display:block;font:900 clamp(26px,5vw,44px)/1 "Noto Sans KR";letter-spacing:-.04em}.st span{font-size:12px;color:#6e6e73}
.ch{padding:90px 16px 30px;max-width:980px;margin:0 auto}.ch:nth-of-type(odd){}
.eyebrow{font:600 clamp(14px,2vw,19px) "Noto Sans KR";color:var(--c);letter-spacing:0}.ch h2{font:900 clamp(44px,11vw,120px)/.98 "Noto Sans KR";letter-spacing:-.06em;margin:6px 0 16px}
.cp{font:600 clamp(20px,3vw,32px)/1.3 "Noto Sans KR";letter-spacing:-.03em;color:#1d1d1f;max-width:24ch;margin-bottom:16px}.ch p{line-height:1.75;color:#515154;margin:8px 0;max-width:60ch}
.hl{height:clamp(260px,62vw,560px);border-radius:28px;background:center/cover;margin:22px 0;transform:scale(.94);transition:transform .9s cubic-bezier(.2,.8,.2,1);box-shadow:0 24px 70px #0002}.ch.in .hl{transform:scale(1)}
.ev{list-style:none;margin:18px 0}.ev li{display:grid;grid-template-columns:96px 1fr;gap:10px;padding:12px 0;border-top:1px solid #0001;font-size:15px}.ev b{font-weight:600;color:#86868b;font-size:13px}.ev .s span{font-weight:700;color:var(--c)}
.mv{color:var(--c)}.mv em{background:#0001}
.strip{display:flex;gap:12px;overflow-x:auto;padding:10px 0 16px}.ph{flex:0 0 auto;width:min(44vw,180px)}.ph.mm{width:min(30vw,110px)}.ph img{display:block;width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:20px}.ph figcaption{font-size:12px;color:#6e6e73;padding-top:6px;font-weight:500}
.grp h3{margin-top:40px;font:900 clamp(30px,6vw,56px)/1 "Noto Sans KR";letter-spacing:-.05em;display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}.grp h3 em{font:600 14px "Noto Sans KR";font-style:normal;color:#86868b}.lede{color:#6e6e73;margin:8px 0 18px;max-width:50ch}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:16px}.card{display:block;text-decoration:none;background:#f5f5f7;border-radius:24px;overflow:hidden;transition:.4s cubic-bezier(.2,.8,.2,1)}.card:hover{transform:scale(1.03);box-shadow:0 20px 50px #0002}.card .rc-th{aspect-ratio:4/3}.cap{padding:14px 16px 18px}.cap i{color:var(--c)}.cap b{font-size:16px;letter-spacing:-.02em}
.tg h4{font-size:15px;margin:14px 0 6px}.tg span{display:inline-block;background:#f5f5f7;border-radius:99px;padding:5px 12px;margin:0 6px 6px 0;font-size:13px}.sched{list-style:none}.sched li{display:grid;grid-template-columns:64px 1fr;padding:9px 0;border-top:1px solid #0001}.sched b{color:var(--c)}.chartbox{color:var(--c)}
footer{text-align:center;color:#86868b;font-size:12px;padding:60px 0}
[data-r]{transform:translateY(60px);transition:1s cubic-bezier(.2,.8,.2,1)}[data-r].in{transform:none}
</style></head><body><div id="app"></div>
<script src="rc.js"></script><script src="dx.js"></script><script>
const {R,story}=DX;
app.innerHTML=`<nav><b>Rescene</b><span>D+${R.sinceDebut}</span></nav><header class="hero"><h1>Scene.<br>Scent.</h1><p>향기로 기억하는 리센느의 시간.</p><div class="imgs" id="hi"></div><div class="sts">${DX.statsHTML()}</div></header>
${story.map(c=>`<section class="ch" data-r style="--c:${c.c[1]}"><div class="eyebrow">${c.meta}</div><h2>${c.title}</h2><p class="cp">${c.caption}</p><div class="hl" style="background-image:url(${R.img(c.group||c.cover)})"></div>${DX.body(c)}${DX.mvbars(c)}${DX.ev(c)}${c.photos.length?`<div class="strip">${DX.ph(c)}</div>`:''}${DX.grp(c)}${DX.extra(c)}</section>`).join('')}<footer>${DX.foot}</footer>`;DX.boot();
const hi=document.getElementById('hi');R.onScroll(y=>{hi.style.transform=`scale(${Math.min(1,.9+y/3000)})`});
</script></body></html>
