<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>리센느 연대기 17 · Glass Aurora</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Pen+Script&family=Pinyon+Script&family=JetBrains+Mono:wght@400;700&family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap">
<style>*{box-sizing:border-box;margin:0;padding:0}html{-webkit-text-size-adjust:100%;overflow-x:hidden}body{overflow-x:clip;font-family:"Noto Sans KR",system-ui,sans-serif;word-break:keep-all;overflow-wrap:anywhere}img{max-width:100%}a{color:inherit}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
.mv{display:grid;grid-template-columns:86px 1fr 90px;gap:8px;align-items:center;font:700 12px "JetBrains Mono";margin:6px 0}.mv em{height:8px;display:block;background:#8883}.mv u{display:block;height:100%;width:var(--w);background:currentColor;animation:g 1.6s both}.mv b{text-align:right}@keyframes g{from{width:0}}.rk{width:100%;overflow:visible}.chartbox{max-width:560px;margin:14px 0}[data-r]{opacity:0;transition:.9s}[data-r].in{opacity:1}.cap{display:grid;gap:2px}.cap i{font:700 11px "JetBrains Mono";font-style:normal}.cap small{opacity:.7;font-size:12px}
body{background:#0c1030;color:#fff;min-height:100vh}
.blob{position:fixed;border-radius:50%;filter:blur(70px);opacity:.7;z-index:-1;animation:fl 18s ease-in-out infinite alternate}.b1{width:60vmax;height:60vmax;background:#ff7ac6;left:-20vmax;top:-20vmax}.b2{width:55vmax;height:55vmax;background:#6a8bff;right:-20vmax;top:20vh;animation-delay:-6s}.b3{width:50vmax;height:50vmax;background:#3ee6c4;left:10vw;bottom:-25vmax;animation-delay:-12s}@keyframes fl{to{transform:translate(8vw,6vh) scale(1.2)}}
.hero{padding:70px 16px 30px;text-align:center}.hero h1{font:900 clamp(52px,15vw,170px)/.92;letter-spacing:-.06em;text-shadow:0 10px 60px #0006}.hero h1 span{font:400 .5em "Pinyon Script";display:block;letter-spacing:0;opacity:.9}
.sts{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:800px;margin:26px auto 0}@media(min-width:760px){.sts{grid-template-columns:repeat(4,1fr)}}
.g,.st,.ch,.card,.ev{background:#ffffff1f;border:1px solid #ffffff55;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 8px 40px #0003,inset 0 1px 0 #fff6}
.st{border-radius:20px;padding:14px;text-align:left}.st b{display:block;font:700 clamp(22px,5vw,34px)}.st span{font-size:11px;opacity:.85}
main{max-width:900px;margin:0 auto;padding:0 14px 80px}
.ch{margin-top:30px;padding:20px;border-radius:30px}.ch .meta{font:700 12px "JetBrains Mono";opacity:.85}.ch h2{font:900 clamp(34px,9vw,72px)/1;letter-spacing:-.05em;margin:6px 0}.cp{font-weight:500;font-size:18px;margin-bottom:8px}.ch p{line-height:1.7;margin:6px 0;opacity:.95}
.hl{height:clamp(190px,45vw,360px);border-radius:22px;background:center/cover;margin:14px 0;box-shadow:0 14px 40px #0005}
.ev{list-style:none;margin:12px 0;border-radius:18px;overflow:hidden}.ev li{display:grid;grid-template-columns:90px 1fr;gap:8px;padding:9px 14px;border-bottom:1px solid #fff3;font-size:14px}.ev li:last-child{border:0}.ev b{font:700 12px "JetBrains Mono";opacity:.8}.ev .s{background:#ffffff2a}.ev .s span{font-weight:700}
.mv{color:#fff}.mv em{background:#ffffff33}
.strip{display:flex;gap:10px;overflow-x:auto;padding:10px 0}.ph{flex:0 0 auto;width:min(40vw,150px)}.ph.mm{width:min(28vw,100px)}.ph img{display:block;width:100%;aspect-ratio:1;object-fit:cover;border-radius:22px;border:1px solid #fff7}.ph figcaption{font:700 11px "JetBrains Mono";padding-top:3px;opacity:.85}
.grp h3{margin-top:26px;font:900 28px;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}.grp h3 em{font:700 11px "JetBrains Mono";font-style:normal;opacity:.8}.lede{font-size:14px;opacity:.9;margin:6px 0 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,200px),1fr));gap:12px}.card{display:block;text-decoration:none;border-radius:22px;overflow:hidden;transition:.4s}.card:hover{transform:translateY(-6px) scale(1.02);background:#ffffff33}.card .rc-th{aspect-ratio:4/3}.cap{padding:10px 14px 14px}.cap b{font-size:15px}
.tg h4{margin:12px 0 4px}.tg span{display:inline-block;background:#ffffff25;border:1px solid #fff5;border-radius:99px;padding:2px 12px;margin:0 5px 5px 0;font-size:13px}.sched{list-style:none}.sched li{display:grid;grid-template-columns:60px 1fr;padding:6px 0;border-bottom:1px solid #fff3}.sched b{font-family:"JetBrains Mono"}.chartbox{color:#fff}
footer{text-align:center;font:700 11px "JetBrains Mono";padding:30px;opacity:.7}[data-r]{transform:translateY(40px) scale(.96)}[data-r].in{transform:none}
</style></head><body><div id="app"></div>
<script src="rc.js"></script><script src="dx.js"></script><script>
const {R,story}=DX;
app.innerHTML=`<i class="blob b1"></i><i class="blob b2"></i><i class="blob b3"></i><header class="hero"><h1>RESCENE<span>aurora of scents</span></h1><div class="sts">${DX.statsHTML()}</div></header><main>
${story.map(c=>`<section class="ch" data-r><div class="meta">${c.n} · ${c.meta}</div><h2>${c.title}</h2><p class="cp">${c.caption}</p><div class="hl" style="background-image:url(${R.img(c.group||c.cover)})"></div>${DX.body(c)}${DX.mvbars(c)}${DX.ev(c)}${c.photos.length?`<div class="strip">${DX.ph(c)}</div>`:''}${DX.grp(c)}${DX.extra(c)}</section>`).join('')}</main><footer>${DX.foot}</footer>`;DX.boot();
</script></body></html>
