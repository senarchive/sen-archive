<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>리센느 연대기 07 · Y2K Chrome</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Pen+Script&family=Pinyon+Script&family=JetBrains+Mono:wght@400;700&family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap">
<style>*{box-sizing:border-box;margin:0;padding:0}html{-webkit-text-size-adjust:100%;overflow-x:hidden}body{overflow-x:clip;font-family:"Noto Sans KR",system-ui,sans-serif;word-break:keep-all;overflow-wrap:anywhere}img{max-width:100%}a{color:inherit}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
.mv{display:grid;grid-template-columns:86px 1fr 90px;gap:8px;align-items:center;font:700 12px "JetBrains Mono";margin:6px 0}.mv em{height:8px;display:block;background:#8883}.mv u{display:block;height:100%;width:var(--w);background:currentColor;animation:g 1.6s both}.mv b{text-align:right}@keyframes g{from{width:0}}.rk{width:100%;overflow:visible}.chartbox{max-width:560px;margin:14px 0}[data-r]{opacity:0;transition:.9s}[data-r].in{opacity:1}.cap{display:grid;gap:2px}.cap i{font:700 11px "JetBrains Mono";font-style:normal}.cap small{opacity:.7;font-size:12px}
:root{--p:#ff6ad5;--c:#6ad7ff;--y:#fff36a}
body{background:linear-gradient(180deg,#1a0b3d,#3b1a73 40%,#14082e);color:#fff;min-height:100vh}
.floor{position:fixed;left:-50%;right:-50%;bottom:0;height:46vh;background:linear-gradient(#0000,#ff6ad533),repeating-linear-gradient(90deg,#6ad7ff55 0 1px,#0000 1px 60px),repeating-linear-gradient(0deg,#6ad7ff55 0 1px,#0000 1px 40px);transform:perspective(300px) rotateX(60deg);transform-origin:bottom;z-index:-1;animation:fl 2s linear infinite}@keyframes fl{to{background-position:0 0,0 0,0 40px}}
.sun{position:fixed;left:50%;top:14vh;width:min(70vw,420px);aspect-ratio:1;border-radius:50%;transform:translateX(-50%);background:linear-gradient(#fff36a,#ff6ad5);z-index:-2;opacity:.55;mask:repeating-linear-gradient(#000 0 14px,#0000 14px 20px);-webkit-mask:repeating-linear-gradient(#000 0 14px,#0000 14px 20px)}
.hero{text-align:center;padding:60px 16px 30px}
.chrome{font:900 clamp(54px,17vw,200px)/.9 "Noto Sans KR";letter-spacing:-.05em;background:linear-gradient(180deg,#fff 0 40%,#b8c9ff 50%,#fff 52%,#ff6ad5 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 0 #3b1a73) drop-shadow(0 0 24px #ff6ad5);animation:bob 4s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-8px)}}
.hero p{font:700 12px "JetBrains Mono";letter-spacing:.3em;color:var(--c);margin-top:10px}
.sts{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:760px;margin:26px auto 0}@media(min-width:700px){.sts{grid-template-columns:repeat(4,1fr)}}
.st{padding:12px;border-radius:16px;background:linear-gradient(#ffffff30,#ffffff08);border:1px solid #fff5;backdrop-filter:blur(6px)}.st b{display:block;font:900 clamp(22px,5vw,34px) "Noto Sans KR";color:var(--y)}.st span{font-size:11px}
main{max-width:900px;margin:0 auto;padding:0 14px 120px}
.ch{margin-top:56px;padding:18px;border-radius:26px;background:linear-gradient(160deg,#ffffff22,#ffffff08);border:1px solid #fff6;box-shadow:inset 0 1px 0 #fff8,0 20px 50px #0006}
.ch .tag{display:inline-block;background:var(--y);color:#2a0d54;font:700 11px "JetBrains Mono";padding:3px 10px;border-radius:99px;transform:rotate(-2deg)}
.ch h2{font:900 clamp(34px,9vw,78px)/1 "Noto Sans KR";letter-spacing:-.04em;margin:8px 0;background:linear-gradient(90deg,var(--p),var(--c));-webkit-background-clip:text;background-clip:text;color:transparent}
.cp{font-weight:500;font-size:18px;margin-bottom:8px}.ch p{line-height:1.7;margin:6px 0;opacity:.92}
.ev{list-style:none;margin:10px 0}.ev li{display:grid;grid-template-columns:90px 1fr;gap:8px;padding:5px 0;border-top:1px solid #fff3;font-size:14px}.ev b{font:700 12px "JetBrains Mono";color:var(--c)}.ev .s span{color:var(--y);font-weight:700}
.strip{display:flex;gap:10px;overflow-x:auto;padding:10px 0}.ph{flex:0 0 auto;width:min(40vw,150px)}.ph.mm{width:min(28vw,100px)}.ph img{display:block;width:100%;aspect-ratio:1;object-fit:cover;border-radius:20px;border:2px solid #fff8}.ph figcaption{font:700 11px "JetBrains Mono";padding-top:3px;color:var(--c)}
.grp h3{margin-top:24px;font:900 30px "Noto Sans KR";display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}.grp h3 em{font:700 11px "JetBrains Mono";font-style:normal;color:var(--y)}.lede{font-size:14px;opacity:.85;margin:6px 0 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,200px),1fr));gap:12px}.card{display:block;text-decoration:none;border-radius:20px;overflow:hidden;background:#ffffff14;border:1px solid #fff5;transition:.3s}.card:hover{transform:translateY(-5px) rotate(-1deg);box-shadow:0 0 30px #ff6ad5aa}.card .rc-th{aspect-ratio:4/3}.cap{padding:10px}.cap i{color:var(--y)}.cap b{font-size:15px}
.tg h4{color:var(--y);margin:12px 0 4px}.tg span{display:inline-block;background:#ffffff1c;border:1px solid #fff5;border-radius:99px;padding:2px 10px;margin:0 5px 5px 0;font-size:13px}.sched{list-style:none}.sched li{display:grid;grid-template-columns:60px 1fr;padding:5px 0;border-top:1px solid #fff3}.sched b{color:var(--y);font-family:"JetBrains Mono"}.chartbox{color:var(--y)}
footer{text-align:center;font:700 11px "JetBrains Mono";padding:20px 0 120px;color:var(--c)}
[data-r]{transform:translateY(40px) scale(.97)}[data-r].in{transform:none}
</style></head><body><div id="app"></div>
<script src="rc.js"></script><script src="dx.js"></script><script>
const {R,story}=DX;
app.innerHTML=`<div class="sun"></div><div class="floor"></div><header class="hero"><div class="chrome">RESCENE<br>★ 2000 ★</div><p>SCENT · SCENE · SINCE 2024.03.26</p><div class="sts">${DX.statsHTML()}</div></header><main>
${story.map(c=>`<section class="ch" data-r><span class="tag">N°${c.n} · ${c.meta}</span><h2>${c.title}</h2><p class="cp">${c.caption}</p>${DX.body(c)}${DX.mvbars(c)}${DX.ev(c)}${c.photos.length?`<div class="strip">${DX.ph(c)}</div>`:''}${DX.grp(c)}${DX.extra(c)}</section>`).join('')}</main><footer>${DX.foot}</footer>`;DX.boot();
</script></body></html>
