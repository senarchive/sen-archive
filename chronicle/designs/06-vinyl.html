<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>리센느 연대기 06 · Vinyl</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Pen+Script&family=Pinyon+Script&family=JetBrains+Mono:wght@400;700&family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap">
<style>*{box-sizing:border-box;margin:0;padding:0}html{-webkit-text-size-adjust:100%;overflow-x:hidden}body{overflow-x:clip;font-family:"Noto Sans KR",system-ui,sans-serif;word-break:keep-all;overflow-wrap:anywhere}img{max-width:100%}a{color:inherit}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
.mv{display:grid;grid-template-columns:86px 1fr 90px;gap:8px;align-items:center;font:700 12px "JetBrains Mono";margin:6px 0}.mv em{height:8px;display:block;background:#8883}.mv u{display:block;height:100%;width:var(--w);background:currentColor;animation:g 1.6s both}.mv b{text-align:right}@keyframes g{from{width:0}}.rk{width:100%;overflow:visible}.chartbox{max-width:560px;margin:14px 0}[data-r]{opacity:0;transition:.9s}[data-r].in{opacity:1}.cap{display:grid;gap:2px}.cap i{font:700 11px "JetBrains Mono";font-style:normal}.cap small{opacity:.7;font-size:12px}
:root{--a:#ff5d8f;--b:#14101b}
body{background:var(--b);color:#f4eef8}
.deck{position:sticky;top:0;z-index:6;background:#0f0b15ee;backdrop-filter:blur(10px);display:flex;align-items:center;gap:12px;padding:8px 14px;border-bottom:1px solid #fff2}
.disc{flex:0 0 52px;width:52px;height:52px;border-radius:50%;background:radial-gradient(circle,var(--a) 0 22%,#111 23% 26%,#222 27% 40%,#111 41%);animation:sp 3s linear infinite;box-shadow:0 0 0 1px #fff3}@keyframes sp{to{transform:rotate(360deg)}}
.deck b{display:block;font-size:14px}.deck small{font:400 11px "JetBrains Mono";opacity:.7}.pg{flex:1}.pg i{display:block;height:3px;background:#fff2;margin-top:6px}.pg u{display:block;height:100%;width:0;background:var(--a)}
.hero{padding:40px 16px;text-align:center}.big{width:min(76vw,380px);aspect-ratio:1;margin:0 auto 26px;border-radius:50%;background:conic-gradient(#111,#222,#111,#2a2a2a,#111);position:relative;animation:sp 12s linear infinite;box-shadow:0 30px 80px #000}
.big::before{content:"";position:absolute;inset:34%;border-radius:50%;background:center/cover url(img/logo.png) #f4d1e2}.big::after{content:"";position:absolute;inset:0;border-radius:50%;background:repeating-radial-gradient(circle,#0000 0 4px,#ffffff0a 4px 5px)}
.hero h1{font:900 clamp(40px,11vw,110px)/.95 "Noto Sans KR";letter-spacing:-.05em}.hero h1 span{font-family:"Pinyon Script";font-weight:400;color:var(--a)}.hero p{opacity:.7;margin-top:8px}
.sts{display:flex;flex-wrap:wrap;gap:12px 26px;justify-content:center;margin-top:20px}.st b{display:block;font:700 24px "JetBrains Mono";color:var(--a)}.st span{font-size:11px;opacity:.7}
.side{max-width:960px;margin:0 auto;padding:0 14px 60px}
.tr{margin-top:46px}.tr .lp{display:grid;gap:18px;grid-template-columns:1fr}@media(min-width:760px){.tr .lp{grid-template-columns:230px 1fr}}
.sleeve{position:relative;width:min(70vw,230px);aspect-ratio:1}.sleeve img.c{width:100%;height:100%;object-fit:cover;position:relative;z-index:2;box-shadow:0 10px 30px #000a}.sleeve::after{content:"";position:absolute;right:-26%;top:6%;width:88%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,var(--c) 0 20%,#111 21%);z-index:1;transition:.6s}.tr.in .sleeve::after{right:-30%}
.no{font:700 12px "JetBrains Mono";color:var(--a);letter-spacing:.2em}.tr h2{font:900 clamp(34px,8vw,72px)/1 "Noto Sans KR";letter-spacing:-.04em;margin:4px 0}.cp{opacity:.85;font-weight:300;font-size:18px;margin-bottom:8px}.tr p{line-height:1.7;margin:6px 0;opacity:.9}
.ev{list-style:none;margin-top:10px}.ev li{display:grid;grid-template-columns:90px 1fr;gap:8px;padding:6px 0;border-bottom:1px dashed #fff3;font-size:14px}.ev b{font:700 12px "JetBrains Mono";opacity:.7}.ev .s span{color:var(--a);font-weight:700}
.strip{display:flex;gap:10px;overflow-x:auto;padding:12px 0}.ph{flex:0 0 auto;width:min(40vw,150px)}.ph.mm{width:min(28vw,104px)}.ph img{display:block;width:100%;aspect-ratio:1;object-fit:cover;border-radius:50%;border:3px solid #222}.ph figcaption{text-align:center;font:700 11px "JetBrains Mono";padding-top:4px;opacity:.7}
.grp h3{font:900 28px "Noto Sans KR";margin-top:28px;display:flex;gap:10px;align-items:baseline}.grp h3 em{font:700 11px "JetBrains Mono";font-style:normal;color:var(--a)}.lede{opacity:.75;font-size:14px;margin:6px 0 12px}
.grid{display:grid;gap:8px}.card{display:grid;grid-template-columns:104px 1fr;gap:12px;align-items:center;text-decoration:none;padding:8px;border-radius:12px;background:#ffffff0a;transition:.3s}.card:hover{background:#ffffff18}.card .rc-th{aspect-ratio:1;border-radius:50%}.card .cap i{color:var(--a)}.cap b{font-size:15px}
@media(min-width:700px){.grid{grid-template-columns:1fr 1fr}}
.tg h4{color:var(--a);margin:12px 0 4px}.tg span{display:inline-block;background:#ffffff14;border-radius:99px;padding:2px 10px;margin:0 5px 5px 0;font-size:13px}.sched{list-style:none}.sched li{display:grid;grid-template-columns:60px 1fr;padding:5px 0;border-bottom:1px dashed #fff3}.sched b{color:var(--a);font-family:"JetBrains Mono"}
footer{text-align:center;opacity:.6;font:11px "JetBrains Mono";padding-bottom:40px}.chartbox{color:var(--a)}
</style></head><body><div id="app"></div>
<script src="rc.js"></script><script src="dx.js"></script><script>
const {R,story}=DX;
app.innerHTML=`<div class="deck"><div class="disc"></div><div><b id="np">Scene + Scent</b><small>NOW PLAYING · D+${R.sinceDebut}</small></div><div class="pg"><i><u id="pgu"></u></i></div></div>
<header class="hero"><div class="big"></div><h1>RE<span>scene</span></h1><p>향기를 따라 돌아가는 레코드 · 7 tracks + B-side</p><div class="sts">${DX.statsHTML()}</div></header><main class="side">
${story.map((c,i)=>`<section class="tr" data-r data-t="${c.title}" style="--c:${c.c[0]}"><div class="lp"><div class="sleeve"><img class="c" src="${R.img(c.cover)}" alt=""></div><div><div class="no">SIDE ${i<5?'A':'B'} · TRACK ${c.n}</div><h2>${c.title}</h2><div class="no" style="color:${c.c[0]}">${c.meta}</div><p class="cp">${c.caption}</p>${DX.body(c)}${DX.mvbars(c)}</div></div>${DX.ev(c)}${c.photos.length?`<div class="strip">${DX.ph(c)}</div>`:''}${DX.grp(c)}${DX.extra(c)}</section>`).join('')}</main><footer>${DX.foot}</footer>`;DX.boot();
const np=document.getElementById('np'),pgu=document.getElementById('pgu'),secs=[...document.querySelectorAll('.tr')];
R.onScroll((y,p)=>{pgu.style.width=p*100+'%';let cur=secs[0];secs.forEach(s=>{if(s.getBoundingClientRect().top<innerHeight*.5)cur=s});np.textContent=cur.dataset.t});
</script></body></html>
