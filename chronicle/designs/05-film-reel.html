<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>리센느 연대기 05 · Film Reel</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Pen+Script&family=Pinyon+Script&family=JetBrains+Mono:wght@400;700&family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap">
<style>*{box-sizing:border-box;margin:0;padding:0}html{-webkit-text-size-adjust:100%;overflow-x:hidden}body{overflow-x:clip;font-family:"Noto Sans KR",system-ui,sans-serif;word-break:keep-all;overflow-wrap:anywhere}img{max-width:100%}a{color:inherit}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

:root{--a:#ffcf5a}
body{background:#0b0b0d;color:#eee}
.hero{min-height:92vh;display:grid;place-items:center;text-align:center;padding:30px 16px;position:relative;background:radial-gradient(circle at 50% 40%,#2a2430,#0b0b0d 70%)}
.hero::before{content:"";position:absolute;inset:0;background:url("img/g_prettygirl.webp") center/cover;opacity:.22;animation:kb 20s ease-in-out infinite alternate}@keyframes kb{to{transform:scale(1.12)}}
.hero>div{position:relative}.hero small{font:700 12px "JetBrains Mono";letter-spacing:.4em;color:var(--a)}.hero h1{font:900 clamp(48px,14vw,170px)/.9 "Noto Sans KR";letter-spacing:-.05em;margin:10px 0}.hero h1 span{font-family:"Pinyon Script";font-weight:400;color:var(--a);display:block;font-size:.55em}
.cd{font:700 clamp(60px,20vw,200px)/1 "JetBrains Mono";color:var(--a);animation:fl 4s infinite}@keyframes fl{0%,92%,100%{opacity:1}94%{opacity:.5}96%{opacity:.9}}
.sts{display:flex;flex-wrap:wrap;justify-content:center;gap:10px 28px;margin-top:20px}.st b{display:block;font:700 22px "JetBrains Mono"}.st span{font-size:11px;opacity:.7}
.reel{position:relative;max-width:900px;margin:0 auto;padding:30px 44px 60px;border-left:26px solid #1a1a1c;border-right:26px solid #1a1a1c;background:#111;background-image:repeating-linear-gradient(180deg,#0000 0 18px,#000 18px 30px);}
.reel::before,.reel::after{content:"";position:absolute;top:0;bottom:0;width:12px;background:repeating-linear-gradient(180deg,#e8e8e8 0 12px,#0000 12px 30px);border-radius:3px;opacity:.85;animation:rl 1.6s linear infinite}.reel::before{left:-19px}.reel::after{right:-19px}@keyframes rl{to{background-position:0 30px}}
@media(max-width:560px){.reel{padding:20px 12px 50px;border-width:0 14px}.reel::before,.reel::after{width:8px}.reel::before{left:-11px}.reel::after{right:-11px}}
.frame{margin:0 0 50px;border:3px solid #000;background:#000;outline:1px solid #333}.frame .top{display:flex;justify-content:space-between;font:700 11px "JetBrains Mono";color:var(--a);padding:5px 8px}
.frame .cover{aspect-ratio:16/9;background:center/cover;position:relative}.frame .cover::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#0000 40%,#000e)}.frame h2{position:absolute;left:12px;bottom:10px;z-index:2;font:900 clamp(32px,8vw,76px)/.95 "Noto Sans KR";letter-spacing:-.04em;text-shadow:0 4px 20px #000}
.txt{padding:14px;background:#141416}.cp{font:italic 500 18px/1.5 "Noto Sans KR";color:var(--a);margin-bottom:8px}.txt p{line-height:1.7;margin:6px 0;opacity:.9}
.ev{list-style:none;margin-top:10px}.ev li{display:grid;grid-template-columns:90px 1fr;gap:8px;padding:5px 0;border-top:1px solid #333;font-size:14px}.ev b{font:700 12px "JetBrains Mono";color:var(--a)}.ev .s span{color:var(--a);font-weight:700}
.mv{display:grid;grid-template-columns:86px 1fr 90px;gap:8px;align-items:center;font:700 12px "JetBrains Mono";margin:6px 0}.mv em{height:8px;background:#333;display:block}.mv u{display:block;height:100%;width:var(--w);background:var(--a);animation:g 1.6s both}.mv b{text-align:right}@keyframes g{from{width:0}}
.strip{display:flex;gap:6px;overflow-x:auto;padding:8px 14px 12px;background:#0d0d0f}.ph{flex:0 0 auto;width:min(38vw,140px)}.ph.mm{width:min(26vw,96px)}.ph img{display:block;width:100%;aspect-ratio:3/4;object-fit:cover;border:2px solid #000}.ph figcaption{font:700 10px "JetBrains Mono";color:#aaa;padding-top:3px}
.grp{padding:12px 14px}.grp h3{font:900 28px "Noto Sans KR";display:flex;gap:10px;align-items:baseline}.grp h3 em{font:700 11px "JetBrains Mono";font-style:normal;color:var(--a);letter-spacing:.2em;text-transform:uppercase}.lede{font-size:14px;opacity:.8;margin:6px 0 12px}
.grid{display:grid;gap:12px}.card{display:block;text-decoration:none;background:#000;border:2px solid #000;outline:1px solid #333;transition:.3s}.card:hover{outline-color:var(--a);transform:scale(1.015)}.card .rc-th{aspect-ratio:16/9}.cap{display:grid;padding:8px 10px;gap:1px}.cap i{font:700 11px "JetBrains Mono";font-style:normal;color:var(--a)}.cap b{font-size:15px}.cap small{opacity:.7;font-size:12px}
.chartbox{margin:14px;color:var(--a)}.rk{width:100%;overflow:visible}.tg{padding:0 14px}.tg h4{color:var(--a);margin:10px 0 4px}.tg span{display:inline-block;border:1px solid #444;border-radius:3px;padding:2px 8px;margin:0 5px 5px 0;font-size:13px}.sched{list-style:none;padding:0 14px 14px}.sched li{display:grid;grid-template-columns:60px 1fr;padding:5px 0;border-top:1px solid #333}.sched b{color:var(--a);font-family:"JetBrains Mono"}
footer{text-align:center;padding:30px;font:700 11px "JetBrains Mono";color:#888}
[data-r]{opacity:0;transform:scale(.96);transition:.9s}[data-r].in{opacity:1;transform:none}
</style></head><body><div id="app"></div>
<script src="rc.js"></script><script src="dx.js"></script><script>
const {R,story}=DX;
app.innerHTML=`<header class="hero"><div><small>A FILM ABOUT SCENT</small><h1>RESCENE<span>the chronicle</span></h1><div class="cd">D+${R.sinceDebut}</div><div class="sts">${DX.statsHTML()}</div></div></header><main class="reel">
${story.map((c,i)=>`<section class="frame" data-r><div class="top"><span>▶ ${String(i+1).padStart(2,'0')}A</span><span>${c.meta}</span></div><div class="cover" style="background-image:url(${R.img(c.group||c.cover||'g_debut')})"><h2>${c.title}</h2></div><div class="txt"><p class="cp">${c.caption}</p>${DX.body(c)}${DX.mvbars(c)}${DX.ev(c)}</div>${c.photos.length?`<div class="strip">${DX.ph(c)}</div>`:''}${DX.grp(c)}${DX.extra(c)}</section>`).join('')}</main><footer>${DX.foot}</footer>`;DX.boot();
</script></body></html>
