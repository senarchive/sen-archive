<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>리센느 연대기 09 · Blueprint</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Pen+Script&family=Pinyon+Script&family=JetBrains+Mono:wght@400;700&family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap">
<style>*{box-sizing:border-box;margin:0;padding:0}html{-webkit-text-size-adjust:100%;overflow-x:hidden}body{overflow-x:clip;font-family:"Noto Sans KR",system-ui,sans-serif;word-break:keep-all;overflow-wrap:anywhere}img{max-width:100%}a{color:inherit}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
.mv{display:grid;grid-template-columns:86px 1fr 90px;gap:8px;align-items:center;font:700 12px "JetBrains Mono";margin:6px 0}.mv em{height:8px;display:block;background:#8883}.mv u{display:block;height:100%;width:var(--w);background:currentColor;animation:g 1.6s both}.mv b{text-align:right}@keyframes g{from{width:0}}.rk{width:100%;overflow:visible}.chartbox{max-width:560px;margin:14px 0}[data-r]{opacity:0;transition:.9s}[data-r].in{opacity:1}.cap{display:grid;gap:2px}.cap i{font:700 11px "JetBrains Mono";font-style:normal}.cap small{opacity:.7;font-size:12px}
:root{--l:#cfe6ff;--b:#0d3b8c}
body{background:var(--b);color:var(--l);font-family:"JetBrains Mono","Noto Sans KR",monospace;background-image:linear-gradient(#ffffff14 1px,transparent 1px),linear-gradient(90deg,#ffffff14 1px,transparent 1px),linear-gradient(#ffffff0a 1px,transparent 1px),linear-gradient(90deg,#ffffff0a 1px,transparent 1px);background-size:100px 100px,100px 100px,20px 20px,20px 20px}
.wrap{max-width:1000px;margin:0 auto;padding:14px 12px 80px}
.frame{border:2px solid var(--l);padding:14px;position:relative}.frame::before{content:"";position:absolute;inset:5px;border:1px solid #cfe6ff66;pointer-events:none}
.title{display:grid;grid-template-columns:1fr auto;gap:10px;border:2px solid var(--l);margin-top:12px;font-size:11px}.title div{padding:8px;border-right:2px solid var(--l)}.title div:last-child{border:0;text-align:right}
h1{font:900 clamp(36px,10vw,110px)/.95 "Noto Sans KR";letter-spacing:-.04em;font-family:"Noto Sans KR";margin:14px 0}h1 span{display:block;font:400 clamp(26px,7vw,60px) "Pinyon Script";color:#ffd86b}
.draw{width:min(80vw,380px);margin:10px auto}.draw svg{width:100%;display:block}.draw path,.draw circle,.draw line{fill:none;stroke:var(--l);stroke-width:1.5;stroke-dasharray:600;stroke-dashoffset:600;animation:d 3.5s ease forwards}@keyframes d{to{stroke-dashoffset:0}}
.sts{display:grid;grid-template-columns:1fr 1fr;border:2px solid var(--l);margin:16px 0}@media(min-width:760px){.sts{grid-template-columns:repeat(4,1fr)}}.st{padding:10px;border:1px solid var(--l)}.st b{display:block;font-size:clamp(22px,5vw,34px);color:#ffd86b}.st span{font-size:10px}
.ch{margin-top:34px;border:2px solid var(--l);padding:14px;position:relative}.ch .no{position:absolute;right:10px;top:-14px;background:var(--b);padding:0 8px;font-weight:700}
.ch h2{font:900 clamp(28px,7vw,60px)/1 "Noto Sans KR";font-family:"Noto Sans KR";letter-spacing:-.04em}.dim{font-size:11px;border-top:1px solid var(--l);border-bottom:1px solid var(--l);margin:8px 0;padding:3px 0;display:flex;justify-content:space-between;gap:6px;flex-wrap:wrap}
.cp{color:#ffd86b;font-size:14px;margin-bottom:6px}.ch p{line-height:1.7;font-size:13px;margin:6px 0;font-family:"Noto Sans KR"}
.ev{list-style:none;margin:10px 0;border:1px solid var(--l)}.ev li{display:grid;grid-template-columns:90px 1fr;gap:6px;padding:6px 8px;border-bottom:1px solid #cfe6ff55;font-size:12px}.ev b{color:#9ec8ff}.ev .s{background:#ffffff1c}.ev .s span{color:#ffd86b;font-weight:700}
.mv{color:#ffd86b}.mv em{background:#ffffff22}
.strip{display:flex;gap:8px;overflow-x:auto;padding:10px 0}.ph{flex:0 0 auto;width:min(40vw,150px);border:1px solid var(--l);padding:4px}.ph.mm{width:min(28vw,100px)}.ph img{display:block;width:100%;aspect-ratio:1;object-fit:cover}.ph figcaption{font-size:10px;padding-top:3px}
.grp h3{margin-top:22px;font:900 22px "Noto Sans KR";display:flex;gap:8px;align-items:baseline}.grp h3 em{font:400 10px "JetBrains Mono";font-style:normal;color:#9ec8ff}.lede{font-size:12px;margin:6px 0 10px;font-family:"Noto Sans KR"}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,200px),1fr));gap:12px}.card{display:block;border:1px solid var(--l);text-decoration:none;padding:6px;position:relative;transition:.3s}.card::before,.card::after{content:"+";position:absolute;font-size:12px;color:#ffd86b}.card::before{left:-6px;top:-10px}.card::after{right:-6px;bottom:-10px}.card:hover{background:#ffffff14}.card .rc-th{aspect-ratio:4/3}.cap{padding-top:6px}.cap i{color:#ffd86b}.cap b{font-size:13px;font-family:"Noto Sans KR"}
.tg h4{color:#ffd86b;margin:10px 0 4px;font-size:12px}.tg span{display:inline-block;border:1px solid var(--l);padding:1px 7px;margin:0 5px 5px 0;font-size:12px;font-family:"Noto Sans KR"}.sched{list-style:none}.sched li{display:grid;grid-template-columns:60px 1fr;padding:4px 0;border-bottom:1px dashed #cfe6ff55;font-size:12px}.sched b{color:#ffd86b}.chartbox{color:#ffd86b}
footer{text-align:center;font-size:11px;padding:30px 0}
[data-r]{opacity:0;transform:translateX(-20px);transition:.8s}[data-r].in{opacity:1;transform:none}
</style></head><body><div id="app"></div>
<script src="rc.js"></script><script src="dx.js"></script><script>
const {R,story}=DX;
app.innerHTML=`<div class="wrap"><div class="frame"><h1>RESCENE<span>— the blueprint of a scent</span></h1><div class="draw"><svg viewBox="0 0 200 200"><circle cx="100" cy="100" r="80"/><circle cx="100" cy="100" r="50"/><path d="M100 20L100 180M20 100L180 100M43 43L157 157M157 43L43 157"/><path d="M70 100a30 30 0 0 1 60 0a30 30 0 0 1-60 0"/></svg></div><div class="title"><div>SHEET 01/10 · RESCENE · CHRONICLE</div><div>D+${R.sinceDebut}</div></div><section class="sts">${DX.statsHTML()}</section></div>
${story.map(c=>`<section class="ch" data-r><span class="no">FIG.${c.n}</span><h2>${c.title}</h2><div class="dim"><span>◀──── ${c.meta} ────▶</span><span>${(c.scent||['',''])[1]}</span></div><p class="cp">// ${c.caption}</p>${DX.body(c)}${DX.mvbars(c)}${DX.ev(c)}${c.photos.length?`<div class="strip">${DX.ph(c)}</div>`:''}${DX.grp(c)}${DX.extra(c)}</section>`).join('')}<footer>${DX.foot}</footer></div>`;DX.boot();
</script></body></html>
