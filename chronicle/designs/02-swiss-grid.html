<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>리센느 연대기 02 · Swiss Grid</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Pen+Script&family=Pinyon+Script&family=JetBrains+Mono:wght@400;700&family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap">
<style>*{box-sizing:border-box;margin:0;padding:0}html{-webkit-text-size-adjust:100%;overflow-x:hidden}body{overflow-x:clip;font-family:"Noto Sans KR",system-ui,sans-serif;word-break:keep-all;overflow-wrap:anywhere}img{max-width:100%}a{color:inherit}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

:root{--r:#ff3b1d;--k:#0d0d0d;--p:#f1efe8}
body{background:var(--p);color:var(--k)}
.mq{background:var(--k);color:var(--p);overflow:hidden;white-space:nowrap;font:900 14px "JetBrains Mono";letter-spacing:.08em;padding:9px 0}
.mq div{display:inline-block;animation:mq 30s linear infinite}@keyframes mq{to{transform:translateX(-50%)}}
.hero{padding:clamp(20px,5vw,60px) 16px 30px;border-bottom:6px solid var(--k);position:relative}
.hero h1{font:900 clamp(64px,19vw,260px)/.82 "Noto Sans KR";letter-spacing:-.06em;text-transform:uppercase}
.hero h1 span{display:block;overflow:hidden}.hero h1 span i{display:block;font-style:normal;transform:translateY(105%);animation:up 1s cubic-bezier(.2,.9,.2,1) forwards}
.hero h1 span:nth-child(2) i{animation-delay:.12s;color:var(--r)}@keyframes up{to{transform:none}}
.hero p{max-width:34ch;margin-top:20px;font-weight:500;font-size:clamp(15px,2vw,19px);line-height:1.5}
.badge{position:absolute;right:16px;top:20px;width:clamp(78px,16vw,150px);animation:spin 18s linear infinite}.badge text{font:700 11px "JetBrains Mono";fill:var(--k)}@keyframes spin{to{transform:rotate(360deg)}}
.sts{display:grid;grid-template-columns:repeat(2,1fr);border-bottom:6px solid var(--k)}
.st{padding:18px 16px;border-right:2px solid var(--k);border-top:2px solid var(--k)}.st:nth-child(2n){border-right:0}
.st b{display:block;font:900 clamp(34px,7vw,84px)/1 "Noto Sans KR";letter-spacing:-.04em;color:var(--r)}.st span{font:500 12px "JetBrains Mono";text-transform:uppercase}
@media(min-width:800px){.sts{grid-template-columns:repeat(4,1fr)}.st{border-right:2px solid var(--k)}.st:nth-child(2n){border-right:2px solid var(--k)}.st:last-child{border-right:0}}
.ch{border-bottom:6px solid var(--k);padding:0 16px 34px;position:relative}
.num{font:900 clamp(120px,40vw,520px)/.78 "Noto Sans KR";letter-spacing:-.08em;color:transparent;-webkit-text-stroke:2px var(--k);margin:8px 0 -.12em;transition:.9s}
.ch.in .num{color:var(--r);-webkit-text-stroke:0}
.ch h2{font:900 clamp(36px,9vw,110px)/.9 "Noto Sans KR";letter-spacing:-.05em;text-transform:uppercase;position:relative}
.meta{font:700 12px "JetBrains Mono";margin:10px 0;text-transform:uppercase;border-top:2px solid var(--k);padding-top:8px;display:flex;gap:12px;justify-content:space-between;flex-wrap:wrap}
.cap{font-weight:900}.ch>.cp{font:700 clamp(20px,3.2vw,32px)/1.25 "Noto Sans KR";max-width:26ch;margin:14px 0}
.row{display:grid;gap:22px}@media(min-width:900px){.row{grid-template-columns:5fr 7fr}}
.ch p{line-height:1.7;margin-bottom:10px;max-width:60ch}
.ev{list-style:none;border-top:2px solid var(--k)}.ev li{display:grid;grid-template-columns:96px 1fr;gap:10px;padding:8px 0;border-bottom:1px solid var(--k);font-size:14px}.ev b{font:700 12px "JetBrains Mono"}.ev .s{background:var(--r);color:#fff;margin:0 -8px;padding:8px}
.mv{display:grid;grid-template-columns:90px 1fr 92px;gap:8px;align-items:center;font:700 12px "JetBrains Mono";margin:7px 0}.mv em{height:12px;background:#0001;display:block}.mv u{display:block;height:100%;width:var(--w);background:var(--k);transform-origin:left;animation:grow 1.6s both}.mv b{text-align:right}@keyframes grow{from{transform:scaleX(0)}}
.strip{display:flex;gap:10px;overflow-x:auto;padding:8px 0 14px;scrollbar-width:thin}.ph{flex:0 0 auto;width:min(46vw,200px)}.ph.mm{width:min(30vw,120px)}.ph img{width:100%;aspect-ratio:1;object-fit:cover;display:block}.ph.mm img{aspect-ratio:4/5}.ph figcaption{font:700 11px "JetBrains Mono";text-transform:uppercase;margin-top:4px}
.grp{margin-top:30px}.grp h3{display:flex;justify-content:space-between;align-items:baseline;border-top:6px solid var(--k);padding-top:8px;font:900 clamp(30px,6vw,64px)/1 "Noto Sans KR";letter-spacing:-.04em}.grp h3 em{font:700 12px "JetBrains Mono";font-style:normal;color:var(--r);text-transform:uppercase}
.lede{font-weight:500;margin:8px 0 14px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,210px),1fr));gap:18px 12px}
.card{display:block;text-decoration:none;color:inherit;border-top:2px solid var(--k);padding-top:8px;transition:.3s}.card:hover{transform:translate(-3px,-3px);box-shadow:5px 5px 0 var(--r)}.card .rc-th{aspect-ratio:4/3}
.cap{display:grid;gap:2px;margin-top:8px}.cap i{font:700 11px "JetBrains Mono";font-style:normal;color:var(--r)}.cap b{font-weight:900;font-size:16px;line-height:1.2}.cap small{font-size:12px;opacity:.7}
.chartbox{margin:20px 0;max-width:560px}.rk{width:100%;overflow:visible}
.tg h4{font:900 22px "Noto Sans KR";margin:16px 0 6px}.tg span{display:inline-block;border:2px solid var(--k);padding:3px 9px;margin:0 6px 6px 0;font-size:13px;font-weight:700;border-radius:99px}
.sched{list-style:none;margin-top:14px}.sched li{display:grid;grid-template-columns:64px 1fr;gap:10px;border-top:2px solid var(--k);padding:7px 0;font-weight:700;font-size:14px}.sched b{color:var(--r);font-family:"JetBrains Mono"}
footer{padding:26px 16px;font:700 12px "JetBrains Mono"}
[data-r]{opacity:0;transform:translateY(34px);transition:1s cubic-bezier(.2,.9,.2,1)}[data-r].in{opacity:1;transform:none}
</style></head><body><div id="app"></div>
<script src="rc.js"></script><script src="dx.js"></script><script>
const {R,story}=DX;const w=R.members.map(m=>m.en).join(' ✱ ');
app.innerHTML=`<div class="mq"><div>${(`RESCENE ✱ ${w} ✱ `).repeat(8)}</div></div>
<header class="hero"><svg class="badge" viewBox="0 0 100 100"><defs><path id="c" d="M50 50m-38 0a38 38 0 1 1 76 0a38 38 0 1 1-76 0"/></defs><text><textPath href="#c">SCENE + SCENT ✱ SINCE 2024.03.26 ✱ </textPath></text></svg>
<h1><span><i>Re</i></span><span><i>Scene</i></span></h1><p>향기로 다시 장면을 떠올리는 다섯 명. 데뷔부터 ${R.sinceDebut}일의 기록.</p></header>
<section class="sts">${DX.statsHTML()}</section>
${story.map(c=>`<section class="ch" data-r><div class="num">${c.n}</div><h2>${c.title}</h2><div class="meta"><span>${c.meta}</span><span>${(c.scent||[''])[1]||''}</span></div><p class="cp">${c.caption}</p>
<div class="row"><div>${DX.body(c)}${DX.mvbars(c)}</div><div>${DX.ev(c)}</div></div>
${c.photos.length?`<div class="strip">${DX.ph(c)}</div>`:''}${DX.grp(c)}${DX.extra(c)}</section>`).join('')}
<footer>${DX.foot}</footer>`;DX.boot();
</script></body></html>
