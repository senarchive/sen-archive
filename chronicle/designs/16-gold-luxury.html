<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>리센느 연대기 16 · Gold Luxury</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Pen+Script&family=Pinyon+Script&family=JetBrains+Mono:wght@400;700&family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap">
<style>*{box-sizing:border-box;margin:0;padding:0}html{-webkit-text-size-adjust:100%;overflow-x:hidden}body{overflow-x:clip;font-family:"Noto Sans KR",system-ui,sans-serif;word-break:keep-all;overflow-wrap:anywhere}img{max-width:100%}a{color:inherit}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
.mv{display:grid;grid-template-columns:86px 1fr 90px;gap:8px;align-items:center;font:700 12px "JetBrains Mono";margin:6px 0}.mv em{height:8px;display:block;background:#8883}.mv u{display:block;height:100%;width:var(--w);background:currentColor;animation:g 1.6s both}.mv b{text-align:right}@keyframes g{from{width:0}}.rk{width:100%;overflow:visible}.chartbox{max-width:560px;margin:14px 0}[data-r]{opacity:0;transition:.9s}[data-r].in{opacity:1}.cap{display:grid;gap:2px}.cap i{font:700 11px "JetBrains Mono";font-style:normal}.cap small{opacity:.7;font-size:12px}
:root{--g:#d9b46a}
body{background:#080808;color:#e9e1d1}
.hero{min-height:100vh;display:grid;place-items:center;text-align:center;padding:30px 16px;position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;inset:-20%;background:conic-gradient(from 0deg,#0000,#d9b46a22,#0000 30%,#d9b46a18,#0000 60%);animation:rot 24s linear infinite}@keyframes rot{to{transform:rotate(360deg)}}
.hero>div{position:relative}.hero .mono{font:700 11px "JetBrains Mono";letter-spacing:.5em;color:var(--g)}.hero h1{font:400 clamp(70px,22vw,260px)/.9 "Pinyon Script";background:linear-gradient(100deg,#8a6a2b,#ffe9a8,#d9b46a,#8a6a2b);background-size:200%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sh 6s linear infinite}@keyframes sh{to{background-position:200%}}
.line{width:1px;height:70px;background:linear-gradient(var(--g),#0000);margin:20px auto}
.sts{display:flex;flex-wrap:wrap;gap:14px 34px;justify-content:center}.st b{display:block;font:300 clamp(26px,6vw,42px) "Noto Sans KR";color:var(--g)}.st span{font-size:11px;letter-spacing:.1em;opacity:.7}
main{max-width:860px;margin:0 auto;padding:0 18px 100px}
.ch{padding:70px 0;border-top:1px solid #d9b46a44}.num{font:400 clamp(70px,20vw,200px)/.8 "Pinyon Script";color:#d9b46a33}
.ch h2{font:300 clamp(34px,8vw,80px)/1 "Noto Sans KR";letter-spacing:.02em;text-transform:uppercase;margin:-10px 0 8px;color:#fff}.ch .meta{font:700 11px "JetBrains Mono";letter-spacing:.3em;color:var(--g);text-transform:uppercase}
.cp{font:400 clamp(30px,6vw,46px)/1.1 "Pinyon Script";color:var(--g);margin:18px 0 8px}.ch p{line-height:1.9;font-weight:300;margin:8px 0}
.hr{height:clamp(200px,50vw,420px);margin:20px 0;background:center/cover;position:relative;clip-path:inset(0 0 0 0)}.hr::after{content:"";position:absolute;inset:10px;border:1px solid var(--g);pointer-events:none}
.ev{list-style:none;margin:16px 0}.ev li{display:grid;grid-template-columns:96px 1fr;gap:8px;padding:10px 0;border-bottom:1px solid #d9b46a33;font-size:14px;font-weight:300}.ev b{font:700 11px "JetBrains Mono";color:var(--g)}.ev .s span{color:var(--g);font-weight:700}
.mv{color:var(--g)}
.strip{display:flex;gap:12px;overflow-x:auto;padding:10px 0}.ph{flex:0 0 auto;width:min(40vw,150px)}.ph.mm{width:min(28vw,100px)}.ph img{display:block;width:100%;aspect-ratio:3/4;object-fit:cover;border:1px solid var(--g);padding:3px;background:#000}.ph figcaption{font:700 10px "JetBrains Mono";letter-spacing:.2em;text-align:center;color:var(--g);padding-top:4px;text-transform:uppercase}
.grp h3{margin-top:34px;font:300 clamp(26px,6vw,44px) "Noto Sans KR";letter-spacing:.04em;color:#fff;display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}.grp h3 em{font:400 28px "Pinyon Script";font-style:normal;color:var(--g)}.lede{font-weight:300;opacity:.8;margin:8px 0 18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,220px),1fr));gap:18px}.card{display:block;text-decoration:none;border:1px solid #d9b46a55;padding:6px;transition:.5s}.card:hover{border-color:var(--g);box-shadow:0 0 30px #d9b46a33}.card .rc-th{aspect-ratio:4/3}.cap{padding:10px 6px 6px}.cap i{color:var(--g)}.cap b{font-weight:500;font-size:15px}
.tg h4{color:var(--g);margin:14px 0 4px;font-weight:400;letter-spacing:.1em}.tg span{display:inline-block;border:1px solid #d9b46a66;padding:2px 12px;margin:0 6px 6px 0;font-size:13px;font-weight:300}.sched{list-style:none}.sched li{display:grid;grid-template-columns:64px 1fr;padding:7px 0;border-bottom:1px solid #d9b46a33;font-weight:300}.sched b{color:var(--g);font-family:"JetBrains Mono"}.chartbox{color:var(--g)}
footer{text-align:center;font:700 10px "JetBrains Mono";letter-spacing:.3em;padding:40px;color:#d9b46a99}[data-r]{transform:translateY(40px);transition:1.4s cubic-bezier(.2,.8,.2,1)}[data-r].in{transform:none}
</style></head><body><div id="app"></div>
<script src="rc.js"></script><script src="dx.js"></script><script>
const {R,story}=DX;
app.innerHTML=`<header class="hero"><div><div class="mono">MAISON DE SCENT</div><h1>Rescene</h1><div class="line"></div><div class="sts">${DX.statsHTML()}</div></div></header><main>
${story.map(c=>`<section class="ch" data-r><div class="num">${c.n}</div><h2>${c.title}</h2><div class="meta">${c.meta}</div><p class="cp">${c.caption}</p><div class="hr" style="background-image:url(${R.img(c.group||c.cover)})"></div>${DX.body(c)}${DX.mvbars(c)}${DX.ev(c)}${c.photos.length?`<div class="strip">${DX.ph(c)}</div>`:''}${DX.grp(c)}${DX.extra(c)}</section>`).join('')}</main><footer>${DX.foot.toUpperCase()}</footer>`;DX.boot();
</script></body></html>
