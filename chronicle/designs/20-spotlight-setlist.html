<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>리센느 연대기 20 · Spotlight Setlist</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Pen+Script&family=Pinyon+Script&family=JetBrains+Mono:wght@400;700&family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap">
<style>*{box-sizing:border-box;margin:0;padding:0}html{-webkit-text-size-adjust:100%;overflow-x:hidden}body{overflow-x:clip;font-family:"Noto Sans KR",system-ui,sans-serif;word-break:keep-all;overflow-wrap:anywhere}img{max-width:100%}a{color:inherit}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
.mv{display:grid;grid-template-columns:86px 1fr 90px;gap:8px;align-items:center;font:700 12px "JetBrains Mono";margin:6px 0}.mv em{height:8px;display:block;background:#8883}.mv u{display:block;height:100%;width:var(--w);background:currentColor;animation:g 1.6s both}.mv b{text-align:right}@keyframes g{from{width:0}}.rk{width:100%;overflow:visible}.chartbox{max-width:560px;margin:14px 0}[data-r]{opacity:0;transition:.9s}[data-r].in{opacity:1}.cap{display:grid;gap:2px}.cap i{font:700 11px "JetBrains Mono";font-style:normal}.cap small{opacity:.7;font-size:12px}
body{background:#000;color:#fff}
.stage{position:relative;min-height:100vh;display:grid;place-items:center;text-align:center;padding:20px;overflow:hidden;background:radial-gradient(ellipse at 50% 100%,#2a0a3a,#000 70%)}
.beam{position:absolute;top:-10%;width:34vmax;height:130%;background:linear-gradient(#ffffff55,#ffffff00 80%);clip-path:polygon(46% 0,54% 0,100% 100%,0 100%);transform-origin:50% 0;animation:sw var(--t) ease-in-out infinite alternate;opacity:.55;mix-blend-mode:screen}.beam:nth-child(1){left:-4%;background:linear-gradient(#ff3d8b99,#0000 80%);--t:5s;transform:rotate(-14deg)}.beam:nth-child(2){left:30%;background:linear-gradient(#6ad7ffaa,#0000 80%);--t:7s;animation-delay:-2s}.beam:nth-child(3){right:-4%;background:linear-gradient(#ffe14a99,#0000 80%);--t:6s;animation-delay:-4s}@keyframes sw{from{transform:rotate(-18deg)}to{transform:rotate(18deg)}}
.stage h1{position:relative;font:900 clamp(56px,17vw,200px)/.88;letter-spacing:-.06em;text-shadow:0 0 40px #fff8}.stage h1 span{display:block;font:700 12px "JetBrains Mono";letter-spacing:.5em;margin-top:14px}
.sts{position:relative;display:flex;flex-wrap:wrap;gap:12px 28px;justify-content:center;margin-top:20px}.st b{display:block;font:900 26px;color:#ffe14a}.st span{font-size:11px;opacity:.8}
main{max-width:900px;margin:0 auto;padding:30px 14px 80px}
.set{margin-top:60px;position:relative}.set::before{content:"";position:absolute;left:50%;top:-30px;width:2px;height:30px;background:#fff6}
.song{display:flex;align-items:baseline;gap:12px;border-bottom:2px solid #fff3;padding-bottom:6px}.song .n{font:700 14px "JetBrains Mono";color:#ff3d8b}.song h2{font:900 clamp(34px,9vw,84px)/1;letter-spacing:-.05em;flex:1;background:linear-gradient(90deg,#fff,var(--c));-webkit-background-clip:text;background-clip:text;color:transparent}
.meta{font:700 11px "JetBrains Mono";letter-spacing:.2em;opacity:.7;margin:8px 0}.cp{font:400 clamp(26px,5vw,38px)/1.1 "Nanum Pen Script";color:#ffe14a;margin:8px 0}.set p{line-height:1.7;margin:6px 0;opacity:.92}
.hl{height:clamp(190px,48vw,380px);background:center/cover;margin:14px 0;position:relative;border-radius:6px;box-shadow:0 0 60px var(--c)}.hl::after{content:"";position:absolute;inset:0;background:linear-gradient(#0000 60%,#000a)}
.ev{list-style:none;margin:10px 0}.ev li{display:grid;grid-template-columns:90px 1fr;gap:8px;padding:7px 0;border-bottom:1px solid #fff2;font-size:14px}.ev b{font:700 12px "JetBrains Mono";color:#ff3d8b}.ev .s span{color:#ffe14a;font-weight:700}
.mv{color:#ff3d8b}.mv em{background:#ffffff22}
.strip{display:flex;gap:10px;overflow-x:auto;padding:10px 0}.ph{flex:0 0 auto;width:min(40vw,150px)}.ph.mm{width:min(28vw,100px)}.ph img{display:block;width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:6px;box-shadow:0 0 22px #ffffff33}.ph figcaption{font:700 11px "JetBrains Mono";padding-top:4px;opacity:.8}
.grp h3{margin-top:26px;font:900 28px;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}.grp h3 em{font:700 11px "JetBrains Mono";font-style:normal;color:#6ad7ff;letter-spacing:.2em}.lede{font-size:14px;opacity:.85;margin:6px 0 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,200px),1fr));gap:12px}.card{display:block;text-decoration:none;background:#111;border-radius:8px;overflow:hidden;transition:.3s}.card:hover{transform:scale(1.04);box-shadow:0 0 30px #ff3d8baa}.card .rc-th{aspect-ratio:4/3}.cap{padding:10px}.cap i{color:#ff3d8b}.cap b{font-size:15px}
.tg h4{color:#ffe14a;margin:12px 0 4px}.tg span{display:inline-block;border:1px solid #fff5;border-radius:99px;padding:2px 12px;margin:0 5px 5px 0;font-size:13px}.sched{list-style:none}.sched li{display:grid;grid-template-columns:60px 1fr;padding:6px 0;border-bottom:1px solid #fff2}.sched b{color:#ff3d8b;font-family:"JetBrains Mono"}.chartbox{color:#ffe14a}
footer{text-align:center;font:700 11px "JetBrains Mono";padding:30px;opacity:.7}[data-r]{transform:translateY(40px);filter:brightness(.3);transition:1s}[data-r].in{transform:none;filter:none}
</style></head><body><div id="app"></div>
<script src="rc.js"></script><script src="dx.js"></script><script>
const {R,story}=DX;
app.innerHTML=`<header class="stage"><i class="beam"></i><i class="beam"></i><i class="beam"></i><div style="position:relative"><h1>RESCENE<span>THE SETLIST · D+${R.sinceDebut}</span></h1><div class="sts">${DX.statsHTML()}</div></div></header><main>
${story.map((c,i)=>`<section class="set" data-r style="--c:${c.c[0]}"><div class="song"><span class="n">${c.n}</span><h2>${c.title}</h2></div><div class="meta">${c.meta}</div><p class="cp">${c.caption}</p><div class="hl" style="background-image:url(${R.img(c.group||c.cover)})"></div>${DX.body(c)}${DX.mvbars(c)}${DX.ev(c)}${c.photos.length?`<div class="strip">${DX.ph(c)}</div>`:''}${DX.grp(c)}${DX.extra(c)}</section>`).join('')}</main><footer>${DX.foot} · ENCORE</footer>`;DX.boot();
</script></body></html>
