<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>리센느 연대기 11 · Metro Line</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Pen+Script&family=Pinyon+Script&family=JetBrains+Mono:wght@400;700&family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap">
<style>*{box-sizing:border-box;margin:0;padding:0}html{-webkit-text-size-adjust:100%;overflow-x:hidden}body{overflow-x:clip;font-family:"Noto Sans KR",system-ui,sans-serif;word-break:keep-all;overflow-wrap:anywhere}img{max-width:100%}a{color:inherit}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
.mv{display:grid;grid-template-columns:86px 1fr 90px;gap:8px;align-items:center;font:700 12px "JetBrains Mono";margin:6px 0}.mv em{height:8px;display:block;background:#8883}.mv u{display:block;height:100%;width:var(--w);background:currentColor;animation:g 1.6s both}.mv b{text-align:right}@keyframes g{from{width:0}}.rk{width:100%;overflow:visible}.chartbox{max-width:560px;margin:14px 0}[data-r]{opacity:0;transition:.9s}[data-r].in{opacity:1}.cap{display:grid;gap:2px}.cap i{font:700 11px "JetBrains Mono";font-style:normal}.cap small{opacity:.7;font-size:12px}
body{background:#f4f6f8;color:#16212b}
header{background:#16212b;color:#fff;padding:34px 16px 28px}header h1{font:900 clamp(40px,11vw,110px)/.95;letter-spacing:-.05em}header h1 span{color:#ffd23f}header p{font:700 12px "JetBrains Mono";letter-spacing:.2em;opacity:.7;margin-top:8px}
.sts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:18px}@media(min-width:760px){.sts{grid-template-columns:repeat(4,1fr)}}.st{background:#ffffff14;border-radius:10px;padding:10px}.st b{display:block;font:900 24px;color:#ffd23f}.st span{font-size:11px;opacity:.8}
.line{position:relative;max-width:900px;margin:0 auto;padding:30px 14px 60px 64px}.line::before{content:"";position:absolute;left:30px;top:0;bottom:0;width:12px;background:linear-gradient(var(--top,#ff9ec4),#7fdcff,#ffbe5c,#9a8cff);border-radius:6px;transform-origin:top;animation:ln 2s both}@keyframes ln{from{transform:scaleY(0)}}
.train{position:absolute;left:21px;top:0;width:30px;height:46px;border-radius:9px;background:#16212b;border:3px solid #ffd23f;z-index:3;transition:top .3s linear}.train::after{content:"";position:absolute;left:5px;right:5px;top:6px;height:12px;background:#ffd23f;border-radius:3px}
.stn{position:relative;margin-bottom:46px}.stn::before{content:"";position:absolute;left:-46px;top:6px;width:28px;height:28px;border-radius:50%;background:#fff;border:7px solid var(--c);z-index:2;transition:.5s;transform:scale(.4)}.stn.in::before{transform:none}
.chip{display:inline-block;background:var(--c);color:#16212b;font:900 13px "JetBrains Mono";padding:2px 10px;border-radius:99px}.stn h2{font:900 clamp(32px,8vw,64px)/1;letter-spacing:-.04em;margin:8px 0}.cp{font-weight:500;font-size:17px;margin-bottom:8px}.stn p{line-height:1.7;margin:6px 0}
.ev{list-style:none;margin:10px 0;background:#fff;border-radius:14px;box-shadow:0 2px 14px #0001}.ev li{display:grid;grid-template-columns:90px 1fr;gap:8px;padding:9px 12px;border-bottom:1px solid #0001;font-size:14px}.ev li:last-child{border:0}.ev b{font:700 12px "JetBrains Mono";color:#6b7a88}.ev .s span{font-weight:900;color:#d6336c}
.mv{color:#16212b}
.strip{display:flex;gap:10px;overflow-x:auto;padding:10px 0}.ph{flex:0 0 auto;width:min(40vw,150px)}.ph.mm{width:min(28vw,100px)}.ph img{display:block;width:100%;aspect-ratio:1;object-fit:cover;border-radius:14px;border:3px solid #fff;box-shadow:0 4px 14px #0003}.ph figcaption{font:700 11px "JetBrains Mono";padding-top:3px}
.grp h3{margin-top:24px;font:900 28px;display:flex;gap:10px;align-items:baseline}.grp h3 em{font:700 11px "JetBrains Mono";font-style:normal;color:#6b7a88}.lede{font-size:14px;margin:6px 0 12px;color:#44505c}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,210px),1fr));gap:12px}.card{display:block;text-decoration:none;background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 2px 14px #0001;transition:.3s}.card:hover{transform:translateY(-4px)}.card .rc-th{aspect-ratio:4/3}.cap{padding:10px}.cap i{color:#d6336c}.cap b{font-size:15px}
.tg h4{margin:12px 0 4px}.tg span{display:inline-block;background:#fff;border:2px solid #16212b;border-radius:99px;padding:1px 10px;margin:0 5px 5px 0;font-size:13px}.sched{list-style:none}.sched li{display:grid;grid-template-columns:60px 1fr;padding:5px 0;border-bottom:1px solid #0002}.sched b{color:#d6336c;font-family:"JetBrains Mono"}.chartbox{color:#d6336c}
footer{text-align:center;font:700 11px "JetBrains Mono";padding:30px}[data-r]{transform:translateX(24px)}[data-r].in{transform:none}
</style></head><body><div id="app"></div>
<script src="rc.js"></script><script src="dx.js"></script><script>
const {R,story}=DX;
app.innerHTML=`<header><h1>RESCENE<br><span>LINE ${story.length}</span></h1><p>THE SCENT LINE · ${story.length} STATIONS · D+${R.sinceDebut}</p><div class="sts">${DX.statsHTML()}</div></header><main class="line" id="ln"><div class="train" id="tr"></div>
${story.map(c=>`<section class="stn" data-r style="--c:${c.c[0]}"><span class="chip">${c.n} · ${c.meta}</span><h2>${c.title}</h2><p class="cp">${c.caption}</p>${DX.body(c)}${DX.mvbars(c)}${DX.ev(c)}${c.photos.length?`<div class="strip">${DX.ph(c)}</div>`:''}${DX.grp(c)}${DX.extra(c)}</section>`).join('')}</main><footer>${DX.foot}</footer>`;DX.boot();
const ln=document.getElementById('ln'),tr=document.getElementById('tr');R.onScroll(()=>{const r=ln.getBoundingClientRect();const p=Math.min(1,Math.max(0,(innerHeight*.4-r.top)/r.height));tr.style.top=(p*(r.height-46))+'px'});
</script></body></html>
