<style>*{box-sizing:border-box;margin:0;padding:0}html{-webkit-text-size-adjust:100%;overflow-x:hidden}body{overflow-x:clip;font-family:"Noto Sans KR",system-ui,sans-serif;word-break:keep-all;overflow-wrap:anywhere}img{max-width:100%}a{color:inherit}

.orb{position:absolute;inset:var(--i);animation:o var(--t) linear infinite}.orb b{position:absolute;left:50%;top:-9px;width:18px;height:18px;margin-left:-9px;border-radius:50%;background:var(--c);box-shadow:0 0 14px var(--c)}@keyframes o{to{transform:rotate(360deg)}}
.hero h1{position:absolute;left:0;right:0;bottom:8vh;font:900 clamp(44px,13vw,140px)/.9;letter-spacing:-.06em;text-shadow:0 0 30px #05060f}.hero h1 span{display:block;font:700 12px "JetBrains Mono";letter-spacing:.4em;color:#9fb4ff;margin-top:8px}
.sts{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:820px;margin:0 auto;padding:0 14px}@media(min-width:760px){.sts{grid-template-columns:repeat(4,1fr)}}.st{border:1px solid #9fb4ff55;border-radius:16px;padding:12px;background:#0b1030aa}.st b{display:block;font:900 clamp(22px,5vw,34px);color:#ffc2dd}.st span{font-size:11px;opacity:.8}

.pl{margin-top:70px;position:relative;padding-top:10px}

.mv{color:#ffc2dd}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,200px),1fr));gap:14px}.card{display:block;text-decoration:none;border-radius:50% 50% 18px 18px/22% 22% 18px 18px;overflow:hidden;background:#0b1030;border:1px solid #9fb4ff55;transition:.4s}.card:hover{transform:translateY(-6px);box-shadow:0 0 30px #9fb4ff66}.card .rc-th{aspect-ratio:4/3}.cap{padding:10px 14px 14px;text-align:center}.cap i{color:#ffc2dd}.cap b{font-size:15px}

</style></head><body><div id="app"></div>
<script src="rc.js"></script><script src="dx.js"></script><script>
const {R,story}=DX;
const orb=story.map((c,i)=>`<i style="--i:${6+i*5.2}%"></i><div class="orb" style="--i:${6+i*5.2}%;--t:${8+i*3}s;--c:${c.c[0]};animation-delay:-${i*2}s"><b></b></div>`).join('');
app.innerHTML=`<header class="hero"><div class="sys"><div class="core"></div>${orb}</div><h1>RESCENE<span>${story.length} WORLDS · D+${R.sinceDebut}</span></h1></header><div class="sts">${DX.statsHTML()}</div><main>
${story.map(c=>`<section class="pl" data-r style="--c:${c.c[0]};--c2:${c.c[1]}"><div class="planet"><img src="${R.img(c.cover)}" alt=""></div><div class="meta">PLANET ${c.n} · ${c.meta}</div><h2>${c.title}</h2><p class="cp">${c.caption}</p><div class="box">${DX.body(c)}${DX.mvbars(c)}${DX.ev(c)}${c.photos.length?`<div class="strip">${DX.ph(c)}</div>`:''}${DX.grp(c)}${DX.extra(c)}</div></section>`).join('')}</main><footer>${DX.foot}</footer>`;DX.boot();
</script></body></html>
