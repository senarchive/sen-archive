<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>리센느 연대기 13 · Apothecary</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Pen+Script&family=Pinyon+Script&family=JetBrains+Mono:wght@400;700&family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap">
<style>*{box-sizing:border-box;margin:0;padding:0}html{-webkit-text-size-adjust:100%;overflow-x:hidden}body{overflow-x:clip;font-family:"Noto Sans KR",system-ui,sans-serif;word-break:keep-all;overflow-wrap:anywhere}img{max-width:100%}a{color:inherit}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
.mv{display:grid;grid-template-columns:86px 1fr 90px;gap:8px;align-items:center;font:700 12px "JetBrains Mono";margin:6px 0}.mv em{height:8px;display:block;background:#8883}.mv u{display:block;height:100%;width:var(--w);background:currentColor;animation:g 1.6s both}.mv b{text-align:right}@keyframes g{from{width:0}}.rk{width:100%;overflow:visible}.chartbox{max-width:560px;margin:14px 0}[data-r]{opacity:0;transition:.9s}[data-r].in{opacity:1}.cap{display:grid;gap:2px}.cap i{font:700 11px "JetBrains Mono";font-style:normal}.cap small{opacity:.7;font-size:12px}
:root{--g:#c8a45b;--b:#1c1511;--p:#f3e8d3}
body{background:var(--b);color:var(--p)}
.hero{text-align:center;padding:60px 16px 30px;background:radial-gradient(circle at 50% 20%,#4a3524,#1c1511 70%)}.bottle{width:96px;margin:0 auto 18px;filter:drop-shadow(0 0 20px #c8a45b66);animation:flo 5s ease-in-out infinite}@keyframes flo{50%{transform:translateY(-10px)}}
.hero h1{font:400 clamp(54px,15vw,160px)/.9 "Pinyon Script";color:var(--g)}.hero p{font:700 12px "JetBrains Mono";letter-spacing:.35em;margin-top:8px;opacity:.75}
.sts{display:flex;flex-wrap:wrap;gap:12px 30px;justify-content:center;margin-top:20px}.st b{display:block;font:300 28px "Noto Sans KR";color:var(--g)}.st span{font-size:11px;opacity:.7}
main{max-width:920px;margin:0 auto;padding:10px 14px 80px}
.lab{margin-top:44px;border:1px solid var(--g);padding:16px;position:relative;background:linear-gradient(#ffffff08,#0000)}.lab::before{content:"";position:absolute;inset:5px;border:1px solid #c8a45b55;pointer-events:none}
.top{display:grid;grid-template-columns:96px 1fr;gap:14px;align-items:center}@media(min-width:620px){.top{grid-template-columns:130px 1fr}}
.vial{width:100%;aspect-ratio:1/1.8;border-radius:14px 14px 28px 28px;border:2px solid var(--g);position:relative;overflow:hidden;background:#ffffff0a}.vial::before{content:"";position:absolute;left:0;right:0;bottom:0;height:var(--lv,60%);background:linear-gradient(var(--c),var(--c2));opacity:.75;animation:fill 2s both;transform-origin:bottom}@keyframes fill{from{transform:scaleY(0)}}.vial::after{content:"";position:absolute;left:30%;right:30%;top:-4px;height:14px;background:var(--g);border-radius:3px}
.lb{font:700 11px "JetBrains Mono";letter-spacing:.2em;color:var(--g)}.lab h2{font:300 clamp(34px,8vw,64px)/1;letter-spacing:-.03em;margin:4px 0}.notes{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}.notes span{border:1px solid var(--g);padding:1px 10px;border-radius:99px;font-size:12px;color:var(--g)}
.cp{font:400 clamp(28px,5.5vw,40px)/1.1 "Nanum Pen Script";color:#ffe3b0;margin:14px 0 6px}.lab p{line-height:1.75;margin:6px 0;opacity:.9}
.ev{list-style:none;margin:10px 0}.ev li{display:grid;grid-template-columns:90px 1fr;gap:8px;padding:7px 0;border-bottom:1px solid #c8a45b44;font-size:14px}.ev b{font:700 11px "JetBrains Mono";color:var(--g)}.ev .s span{color:#ffe3b0;font-weight:700}
.mv{color:var(--g)}
.strip{display:flex;gap:10px;overflow-x:auto;padding:10px 0}.ph{flex:0 0 auto;width:min(40vw,150px)}.ph.mm{width:min(28vw,100px)}.ph img{display:block;width:100%;aspect-ratio:1;object-fit:cover;border:1px solid var(--g);padding:4px;background:#0003}.ph figcaption{font:700 10px "JetBrains Mono";letter-spacing:.15em;text-align:center;padding-top:3px;color:var(--g)}
.grp h3{margin-top:24px;font:300 28px;display:flex;gap:10px;align-items:baseline;color:var(--g)}.grp h3 em{font:400 24px "Pinyon Script";font-style:normal;color:var(--p)}.lede{font-size:14px;margin:6px 0 12px;opacity:.8}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,200px),1fr));gap:12px}.card{display:block;text-decoration:none;border:1px solid var(--g);padding:6px;transition:.3s}.card:hover{background:#c8a45b22}.card .rc-th{aspect-ratio:4/3}.cap{padding-top:6px}.cap i{color:var(--g)}.cap b{font-weight:500;font-size:15px}
.tg h4{color:var(--g);margin:12px 0 4px}.tg span{display:inline-block;border:1px solid var(--g);border-radius:99px;padding:1px 10px;margin:0 5px 5px 0;font-size:13px}.sched{list-style:none}.sched li{display:grid;grid-template-columns:60px 1fr;padding:5px 0;border-bottom:1px solid #c8a45b44}.sched b{color:var(--g);font-family:"JetBrains Mono"}.chartbox{color:var(--g)}
footer{text-align:center;font:700 11px "JetBrains Mono";padding:30px;opacity:.6}[data-r]{transform:translateY(24px)}[data-r].in{transform:none}
</style></head><body><div id="app"></div>
<script src="rc.js"></script><script src="dx.js"></script><script>
const {R,story}=DX;
const bottle=`<svg class="bottle" viewBox="0 0 100 160" fill="none" stroke="#c8a45b" stroke-width="2"><rect x="38" y="4" width="24" height="22" rx="3"/><rect x="44" y="26" width="12" height="12"/><path d="M26 56q0-18 24-18t24 18v70q0 22-24 22t-24-22z"/><path d="M34 100q16 10 32 0v26q0 14-16 14t-16-14z" fill="#c8a45b66"/></svg>`;
app.innerHTML=`<header class="hero">${bottle}<h1>Rescene</h1><p>EAU DE CHRONICLE · D+${R.sinceDebut}</p><div class="sts">${DX.statsHTML()}</div></header><main>
${story.map((c,i)=>`<section class="lab" data-r style="--c:${c.c[0]};--c2:${c.c[1]};--lv:${35+i*8}%"><div class="top"><div class="vial"></div><div><div class="lb">N°${c.n} · ${c.meta}</div><h2>${c.title}</h2><div class="notes">${(c.scent||[]).map(s=>`<span>${s}</span>`).join('')}</div></div></div><p class="cp">${c.caption}</p>${DX.body(c)}${DX.mvbars(c)}${DX.ev(c)}${c.photos.length?`<div class="strip">${DX.ph(c)}</div>`:''}${DX.grp(c)}${DX.extra(c)}</section>`).join('')}</main><footer>${DX.foot}</footer>`;DX.boot();
</script></body></html>
