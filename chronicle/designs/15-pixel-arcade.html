<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>리센느 연대기 15 · Pixel Arcade</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Pen+Script&family=Pinyon+Script&family=JetBrains+Mono:wght@400;700&family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap">
<style>*{box-sizing:border-box;margin:0;padding:0}html{-webkit-text-size-adjust:100%;overflow-x:hidden}body{overflow-x:clip;font-family:"Noto Sans KR",system-ui,sans-serif;word-break:keep-all;overflow-wrap:anywhere}img{max-width:100%}a{color:inherit}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
.mv{display:grid;grid-template-columns:86px 1fr 90px;gap:8px;align-items:center;font:700 12px "JetBrains Mono";margin:6px 0}.mv em{height:8px;display:block;background:#8883}.mv u{display:block;height:100%;width:var(--w);background:currentColor;animation:g 1.6s both}.mv b{text-align:right}@keyframes g{from{width:0}}.rk{width:100%;overflow:visible}.chartbox{max-width:560px;margin:14px 0}[data-r]{opacity:0;transition:.9s}[data-r].in{opacity:1}.cap{display:grid;gap:2px}.cap i{font:700 11px "JetBrains Mono";font-style:normal}.cap small{opacity:.7;font-size:12px}
:root{--a:#39ff88;--p:#ff3df0;--y:#ffe14a;--c:#3df0ff}
body{background:#10002b;color:#fff;font-family:"JetBrains Mono","Noto Sans KR",monospace;image-rendering:pixelated}
body::before{content:"";position:fixed;inset:0;background:repeating-linear-gradient(#0000 0 2px,#0004 2px 4px);pointer-events:none;z-index:9}
.hud{position:sticky;top:0;z-index:5;background:#000;border-bottom:4px solid var(--p);padding:8px 12px;display:flex;justify-content:space-between;font-weight:700;font-size:12px;color:var(--y)}
.hero{text-align:center;padding:50px 14px 20px}.hero h1{font:700 clamp(40px,13vw,130px)/1 "Noto Sans KR";letter-spacing:.05em;color:var(--a);text-shadow:4px 4px 0 var(--p),8px 8px 0 #000}.blink{animation:b 1s steps(2) infinite;color:var(--y);font-weight:700;margin-top:18px}@keyframes b{50%{opacity:0}}
.sts{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:760px;margin:22px auto}@media(min-width:760px){.sts{grid-template-columns:repeat(4,1fr)}}.st{border:4px solid var(--c);padding:8px;background:#000}.st b{display:block;font-size:24px;color:var(--y)}.st span{font-size:10px}
main{max-width:900px;margin:0 auto;padding:0 12px 80px}
.lv{margin-top:36px;border:4px solid var(--c);background:#1a0540;padding:14px;box-shadow:8px 8px 0 #000}.lv .tag{display:inline-block;background:var(--p);color:#000;font-weight:700;padding:2px 10px;font-size:12px}
.lv h2{font:700 clamp(28px,7vw,60px)/1.05 "Noto Sans KR";color:var(--y);margin:8px 0;text-shadow:3px 3px 0 #000}.hp{height:14px;border:3px solid #fff;margin:8px 0;background:#000}.hp u{display:block;height:100%;width:var(--w,50%);background:repeating-linear-gradient(90deg,var(--a) 0 8px,#0000 8px 10px);animation:g 1.6s steps(12) both}
.cp{color:var(--c);font-size:14px;margin-bottom:8px}.lv p{line-height:1.7;font-size:13px;margin:6px 0;font-family:"Noto Sans KR"}
.ev{list-style:none;margin:10px 0;border:3px dashed var(--p)}.ev li{display:grid;grid-template-columns:88px 1fr;gap:8px;padding:6px 8px;font-size:12px}.ev b{color:var(--a)}.ev .s span{color:var(--y);font-weight:700}
.mv{color:var(--a)}.mv em{background:#000;border:2px solid #fff;height:12px}
.strip{display:flex;gap:10px;overflow-x:auto;padding:10px 0}.ph{flex:0 0 auto;width:min(36vw,130px);border:4px solid #fff;background:#000}.ph.mm{width:min(26vw,92px)}.ph img{display:block;width:100%;aspect-ratio:1;object-fit:cover}.ph figcaption{font-size:10px;text-align:center;background:var(--p);color:#000;font-weight:700;padding:2px}
.grp h3{margin-top:22px;font-size:20px;color:var(--a);display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}.grp h3::before{content:"▶";color:var(--p)}.grp h3 em{font-size:10px;font-style:normal;color:var(--c)}.lede{font-size:12px;margin:6px 0 12px;font-family:"Noto Sans KR"}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,200px),1fr));gap:12px}.card{display:block;text-decoration:none;border:4px solid #fff;background:#000;transition:.1s steps(2)}.card:hover{border-color:var(--y);transform:translate(-4px,-4px);box-shadow:6px 6px 0 var(--p)}.card .rc-th{aspect-ratio:4/3}.cap{padding:6px 8px}.cap i{color:var(--y)}.cap b{font-size:12px;font-family:"Noto Sans KR"}
.tg h4{color:var(--y);margin:12px 0 4px;font-size:12px}.tg span{display:inline-block;border:2px solid var(--c);padding:0 7px;margin:0 5px 5px 0;font-size:12px;font-family:"Noto Sans KR"}.sched{list-style:none}.sched li{display:grid;grid-template-columns:60px 1fr;padding:4px 0;font-size:12px;border-bottom:2px dotted var(--p)}.sched b{color:var(--y)}.chartbox{color:var(--a)}
footer{text-align:center;font-size:11px;padding:30px;color:var(--c)}[data-r]{transform:translateY(20px);transition:.5s steps(5)}[data-r].in{transform:none}
</style></head><body><div id="app"></div>
<script src="rc.js"></script><script src="dx.js"></script><script>
const {R,story}=DX;
app.innerHTML=`<div class="hud"><span>1UP RESCENE</span><span id="sc">SCORE 000000</span><span>HI D+${R.sinceDebut}</span></div><header class="hero"><h1>RE:SCENE<br>QUEST</h1><p class="blink">▶ PRESS START ◀</p><div class="sts">${DX.statsHTML()}</div></header><main>
${story.map((c,i)=>`<section class="lv" data-r data-pts="${(i+1)*1000}"><span class="tag">LEVEL ${c.n}</span><h2>${c.title}</h2><div class="hp"><u style="--w:${Math.round((i+1)/story.length*100)}%"></u></div><p class="cp">${c.meta}</p><p class="cp" style="color:#fff">&gt; ${c.caption}</p>${DX.body(c)}${DX.mvbars(c)}${DX.ev(c)}${c.photos.length?`<div class="strip">${DX.ph(c)}</div>`:''}${DX.grp(c)}${DX.extra(c)}</section>`).join('')}</main><footer>${DX.foot} · GAME CLEAR</footer>`;DX.boot();
const sc=document.getElementById('sc'),lv=[...document.querySelectorAll('.lv')];R.onScroll(()=>{let n=0;lv.forEach((s,i)=>{if(s.getBoundingClientRect().top<innerHeight*.6)n=(i+1)*1000});sc.textContent='SCORE '+String(n+Math.round(scrollY/10)).padStart(6,'0')});
</script></body></html>
