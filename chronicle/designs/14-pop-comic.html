<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>리센느 연대기 14 · Pop Comic</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Pen+Script&family=Pinyon+Script&family=JetBrains+Mono:wght@400;700&family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap">
<style>*{box-sizing:border-box;margin:0;padding:0}html{-webkit-text-size-adjust:100%;overflow-x:hidden}body{overflow-x:clip;font-family:"Noto Sans KR",system-ui,sans-serif;word-break:keep-all;overflow-wrap:anywhere}img{max-width:100%}a{color:inherit}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
.mv{display:grid;grid-template-columns:86px 1fr 90px;gap:8px;align-items:center;font:700 12px "JetBrains Mono";margin:6px 0}.mv em{height:8px;display:block;background:#8883}.mv u{display:block;height:100%;width:var(--w);background:currentColor;animation:g 1.6s both}.mv b{text-align:right}@keyframes g{from{width:0}}.rk{width:100%;overflow:visible}.chartbox{max-width:560px;margin:14px 0}[data-r]{opacity:0;transition:.9s}[data-r].in{opacity:1}.cap{display:grid;gap:2px}.cap i{font:700 11px "JetBrains Mono";font-style:normal}.cap small{opacity:.7;font-size:12px}
:root{--y:#ffe14a;--p:#ff3d8b;--c:#17b8ff;--k:#111}
body{background:var(--y);color:var(--k);background-image:radial-gradient(#0002 18%,#0000 19%);background-size:14px 14px}
.hero{padding:36px 14px 20px;text-align:center}.hero h1{font:900 clamp(56px,18vw,200px)/.85;letter-spacing:-.06em;color:var(--p);-webkit-text-stroke:3px var(--k);text-shadow:6px 6px 0 var(--k);transform:rotate(-3deg);animation:wob 3s ease-in-out infinite}@keyframes wob{50%{transform:rotate(-1deg) scale(1.03)}}
.burst{display:inline-block;background:var(--c);color:#fff;border:3px solid var(--k);padding:8px 20px;font:900 20px;margin-top:20px;clip-path:polygon(0 10%,10% 0,25% 10%,40% 0,55% 10%,70% 0,85% 10%,100% 0,100% 90%,85% 100%,70% 90%,55% 100%,40% 90%,25% 100%,10% 90%,0 100%);padding:16px 32px}
.sts{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:800px;margin:22px auto 0}@media(min-width:760px){.sts{grid-template-columns:repeat(4,1fr)}}.st{background:#fff;border:3px solid var(--k);padding:8px;box-shadow:5px 5px 0 var(--k)}.st b{display:block;font:900 28px;color:var(--p)}.st span{font-size:11px;font-weight:700}
main{max-width:940px;margin:0 auto;padding:10px 14px 70px}
.pn{margin-top:36px;background:#fff;border:4px solid var(--k);box-shadow:8px 8px 0 var(--k);padding:14px;position:relative;transition:.5s}
.pn::before{content:attr(data-n);position:absolute;right:-6px;top:-22px;background:var(--p);color:#fff;border:3px solid var(--k);font:900 22px;padding:2px 12px;transform:rotate(4deg)}
.pn h2{font:900 clamp(32px,9vw,70px)/.95;letter-spacing:-.05em;background:var(--c);display:inline-block;border:3px solid var(--k);padding:4px 12px;transform:rotate(-1.5deg);color:#fff;text-shadow:3px 3px 0 var(--k)}
.meta{font:700 12px "JetBrains Mono";margin:10px 0}.cp{position:relative;background:#fff;border:3px solid var(--k);border-radius:20px;padding:10px 14px;font-weight:900;font-size:18px;margin:12px 0 16px}.cp::after{content:"";position:absolute;left:30px;bottom:-14px;width:20px;height:20px;background:#fff;border-right:3px solid var(--k);border-bottom:3px solid var(--k);transform:rotate(45deg)}
.pn p{line-height:1.7;margin:6px 0}.ev{list-style:none;margin:12px 0;border:3px solid var(--k)}.ev li{display:grid;grid-template-columns:90px 1fr;gap:8px;padding:6px 10px;border-bottom:2px solid var(--k);font-size:14px}.ev li:last-child{border:0}.ev b{font:700 12px "JetBrains Mono"}.ev .s{background:var(--y)}.ev .s span{font-weight:900}
.mv{color:var(--p)}.mv em{background:#0002}
.strip{display:flex;gap:10px;overflow-x:auto;padding:12px 4px 16px}.ph{flex:0 0 auto;width:min(40vw,150px);background:#fff;border:3px solid var(--k);box-shadow:4px 4px 0 var(--k);transform:rotate(var(--r,0deg))}.ph:nth-child(odd){--r:-2deg}.ph:nth-child(even){--r:2deg}.ph.mm{width:min(28vw,100px)}.ph img{display:block;width:100%;aspect-ratio:1;object-fit:cover}.ph figcaption{font:900 11px;text-align:center;padding:2px;border-top:3px solid var(--k);background:var(--y)}
.grp h3{margin-top:22px;font:900 30px;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}.grp h3 em{font:900 12px "JetBrains Mono";font-style:normal;background:var(--k);color:var(--y);padding:2px 8px}.lede{font-size:14px;font-weight:500;margin:6px 0 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,200px),1fr));gap:16px}.card{display:block;text-decoration:none;background:#fff;border:3px solid var(--k);box-shadow:5px 5px 0 var(--k);transition:.15s}.card:hover{transform:translate(-3px,-3px) rotate(-1deg);box-shadow:9px 9px 0 var(--p)}.card .rc-th{aspect-ratio:4/3;border-bottom:3px solid var(--k)}.cap{padding:8px 10px}.cap i{color:var(--p)}.cap b{font:900 15px}
.tg h4{margin:12px 0 4px;font-weight:900}.tg span{display:inline-block;background:var(--y);border:2px solid var(--k);padding:0 9px;margin:0 5px 5px 0;font:700 13px;border-radius:99px}.sched{list-style:none}.sched li{display:grid;grid-template-columns:60px 1fr;padding:5px 0;border-bottom:2px solid var(--k);font-weight:700}.sched b{color:var(--p);font-family:"JetBrains Mono"}.chartbox{color:var(--p)}
footer{text-align:center;font:900 12px "JetBrains Mono";padding:20px}[data-r]{transform:scale(.85) rotate(-2deg)}[data-r].in{transform:none}
</style></head><body><div id="app"></div>
<script src="rc.js"></script><script src="dx.js"></script><script>
const {R,story}=DX;
app.innerHTML=`<header class="hero"><h1>RE<br>SCENE!</h1><span class="burst">D+${R.sinceDebut} · 향기 대폭발</span><div class="sts">${DX.statsHTML()}</div></header><main>
${story.map(c=>`<section class="pn" data-r data-n="#${c.n}"><h2>${c.title}</h2><div class="meta">${c.meta}</div><p class="cp">${c.caption}</p>${DX.body(c)}${DX.mvbars(c)}${DX.ev(c)}${c.photos.length?`<div class="strip">${DX.ph(c)}</div>`:''}${DX.grp(c)}${DX.extra(c)}</section>`).join('')}</main><footer>${DX.foot}</footer>`;DX.boot();
</script></body></html>
