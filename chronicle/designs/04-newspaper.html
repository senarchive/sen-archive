<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>리센느 연대기 04 · Newspaper</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Pen+Script&family=Pinyon+Script&family=JetBrains+Mono:wght@400;700&family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap">
<style>*{box-sizing:border-box;margin:0;padding:0}html{-webkit-text-size-adjust:100%;overflow-x:hidden}body{overflow-x:clip;font-family:"Noto Sans KR",system-ui,sans-serif;word-break:keep-all;overflow-wrap:anywhere}img{max-width:100%}a{color:inherit}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

:root{--i:#1b1712;--p:#efe6d2;--r:#a2281d}
body{background:#d8ceb6;color:var(--i)}
.sheet{max-width:1100px;margin:0 auto;background:var(--p);padding:14px 16px 50px;box-shadow:0 0 60px #0004;background-image:radial-gradient(#0000 60%,#6b4e1a14)}
.mast{text-align:center;border-bottom:4px double var(--i);padding-bottom:10px}
.mast h1{font:900 clamp(40px,12vw,130px)/.95;letter-spacing:-.04em}.mast h1 span{font-family:"Pinyon Script";font-weight:400;color:var(--r)}
.line{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font:700 11px "JetBrains Mono";border-bottom:1px solid var(--i);padding:6px 0;text-transform:uppercase}
.sts{display:grid;grid-template-columns:repeat(2,1fr);border-bottom:2px solid var(--i)}.st{padding:12px;text-align:center;border-right:1px solid var(--i)}.st:nth-child(2n){border:0}.st b{display:block;font:900 clamp(30px,6vw,56px)/1;color:var(--r)}.st span{font-size:12px;font-weight:700}
@media(min-width:760px){.sts{grid-template-columns:repeat(4,1fr)}.st:nth-child(2n){border-right:1px solid var(--i)}.st:last-child{border:0}}
.ch{padding:22px 0;border-bottom:2px solid var(--i)}
.kick{font:700 12px "JetBrains Mono";color:var(--r);text-transform:uppercase;letter-spacing:.1em}
.ch h2{font:900 clamp(34px,8vw,84px)/.95;letter-spacing:-.04em;margin:4px 0 8px}
.cp{font:italic 500 clamp(17px,2.6vw,24px)/1.4;border-top:1px solid var(--i);border-bottom:1px solid var(--i);padding:8px 0;margin-bottom:12px}
.cols{columns:1;column-gap:26px;column-rule:1px solid #0004;text-align:justify;line-height:1.75;font-size:15px}@media(min-width:760px){.cols{columns:2}}
.cols p:first-child::first-letter{float:left;font:900 64px/.8 "Noto Sans KR";padding:6px 8px 0 0;color:var(--r)}
.ev{list-style:none;margin:14px 0;break-inside:avoid}.ev li{display:grid;grid-template-columns:88px 1fr;gap:6px;border-bottom:1px dotted var(--i);padding:5px 0;font-size:14px}.ev b{font:700 11px "JetBrains Mono"}.ev .s span{background:var(--i);color:var(--p);padding:0 4px}
.mv{display:grid;grid-template-columns:86px 1fr 88px;gap:8px;font:700 12px "JetBrains Mono";margin:5px 0;align-items:center}.mv em{height:10px;border:1px solid var(--i);display:block}.mv u{display:block;height:100%;width:var(--w);background:repeating-linear-gradient(45deg,var(--i) 0 2px,#0000 2px 4px);animation:g 1.6s both}.mv b{text-align:right}@keyframes g{from{width:0}}
.strip{display:flex;gap:10px;overflow-x:auto;padding:10px 0}.ph{flex:0 0 auto;width:min(42vw,170px)}.ph.mm{width:min(28vw,110px)}.ph img{display:block;width:100%;aspect-ratio:1;object-fit:cover;filter:sepia(.25) contrast(1.05);border:1px solid var(--i)}.ph.mm img{aspect-ratio:4/5}.ph figcaption{font:italic 12px/1.2 "Noto Sans KR";border-bottom:1px solid var(--i);padding:3px 0}
.grp h3{margin-top:24px;font:900 clamp(24px,5vw,44px);border-top:3px solid var(--i);border-bottom:1px solid var(--i);padding:4px 0;display:flex;justify-content:space-between;align-items:baseline}.grp h3 em{font:700 11px "JetBrains Mono";font-style:normal;text-transform:uppercase;color:var(--r)}.lede{font-style:italic;margin:8px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:16px;column-gap:20px}.card{display:block;text-decoration:none;border-bottom:1px solid var(--i);padding-bottom:10px}.card .rc-th{aspect-ratio:3/2;filter:sepia(.2)}.cap{display:grid;gap:2px;margin-top:6px}.cap i{font:700 10px "JetBrains Mono";font-style:normal;color:var(--r)}.cap b{font:900 17px/1.2}.cap small{font-size:12px}
.chartbox{max-width:560px;margin:14px 0;color:var(--i)}.rk{width:100%;overflow:visible}.tg h4{font:900 18px;margin:12px 0 4px}.tg span{display:inline-block;border:1px solid var(--i);padding:1px 8px;margin:0 5px 5px 0;font-size:13px}.sched{list-style:none}.sched li{display:grid;grid-template-columns:60px 1fr;border-bottom:1px dotted var(--i);padding:4px 0;font-weight:700}.sched b{color:var(--r)}
footer{text-align:center;font:700 11px "JetBrains Mono";padding-top:18px}
[data-r]{opacity:0;transition:1.1s}[data-r].in{opacity:1}.ch h2{clip-path:inset(0 100% 0 0);transition:1.2s .1s cubic-bezier(.7,0,.2,1)}.ch.in h2{clip-path:inset(0)}
</style></head><body><div id="app"></div>
<script src="rc.js"></script><script src="dx.js"></script><script>
const {R,story}=DX;
app.innerHTML=`<div class="sheet"><div class="line"><span>Vol. ${R.members.length}</span><span>Est. 2024.03.26</span><span>D+${R.sinceDebut}</span></div><div class="mast"><h1>THE <span>Rescene</span> TIMES</h1></div><div class="line"><span>향기로 다시 장면을</span><span>REMINE EDITION</span><span>${R.todayISO}</span></div><section class="sts">${DX.statsHTML()}</section>
${story.map(c=>`<article class="ch" data-r><div class="kick">N° ${c.n} · ${c.meta}</div><h2>${c.title}</h2><p class="cp">${c.caption}</p><div class="cols">${DX.body(c)}${DX.ev(c)}</div>${DX.mvbars(c)}${c.photos.length?`<div class="strip">${DX.ph(c)}</div>`:''}${DX.grp(c)}${DX.extra(c)}</article>`).join('')}<footer>${DX.foot}</footer></div>`;DX.boot();
</script></body></html>
