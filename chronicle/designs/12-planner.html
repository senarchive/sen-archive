<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>리센느 연대기 12 · Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Pen+Script&family=Pinyon+Script&family=JetBrains+Mono:wght@400;700&family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap">
<style>*{box-sizing:border-box;margin:0;padding:0}html{-webkit-text-size-adjust:100%;overflow-x:hidden}body{overflow-x:clip;font-family:"Noto Sans KR",system-ui,sans-serif;word-break:keep-all;overflow-wrap:anywhere}img{max-width:100%}a{color:inherit}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
.mv{display:grid;grid-template-columns:86px 1fr 90px;gap:8px;align-items:center;font:700 12px "JetBrains Mono";margin:6px 0}.mv em{height:8px;display:block;background:#8883}.mv u{display:block;height:100%;width:var(--w);background:currentColor;animation:g 1.6s both}.mv b{text-align:right}@keyframes g{from{width:0}}.rk{width:100%;overflow:visible}.chartbox{max-width:560px;margin:14px 0}[data-r]{opacity:0;transition:.9s}[data-r].in{opacity:1}.cap{display:grid;gap:2px}.cap i{font:700 11px "JetBrains Mono";font-style:normal}.cap small{opacity:.7;font-size:12px}
body{background:#fbf3e4;color:#3a2b1d;background-image:radial-gradient(#d9c9a8 1px,#0000 1px);background-size:22px 22px}
.cover{padding:40px 16px 20px;text-align:center}.cover h1{font:900 clamp(44px,12vw,120px)/.95;letter-spacing:-.05em;color:#e0457b;text-shadow:3px 3px 0 #ffd23f}.cover p{font:400 clamp(28px,6vw,46px) "Nanum Pen Script";margin-top:6px}
.sts{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:820px;margin:22px auto}@media(min-width:760px){.sts{grid-template-columns:repeat(4,1fr)}}.st{background:#fff;border:3px solid #3a2b1d;border-radius:14px;padding:10px;box-shadow:4px 4px 0 #3a2b1d;transform:rotate(var(--r,0deg))}.st:nth-child(odd){--r:-1.5deg}.st:nth-child(even){--r:1.2deg}.st b{display:block;font:900 26px;color:#e0457b}.st span{font-size:11px}
main{max-width:900px;margin:0 auto;padding:0 14px 80px}
.page{margin-top:40px;background:#fffdf8;border:3px solid #3a2b1d;border-radius:18px;box-shadow:8px 8px 0 #3a2b1d;overflow:hidden}
.mh{display:flex;justify-content:space-between;align-items:center;background:var(--c);padding:10px 16px;border-bottom:3px solid #3a2b1d}.mh b{font:900 clamp(26px,7vw,52px)/1;letter-spacing:-.04em}.mh span{font:700 11px "JetBrains Mono";text-align:right}
.pb{padding:16px}.cp{font:400 clamp(26px,5vw,38px)/1.1 "Nanum Pen Script";margin-bottom:8px}.pb p{line-height:1.7;margin:6px 0}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin:12px 0;font:700 10px "JetBrains Mono"}.cal i{aspect-ratio:auto;height:clamp(26px,6vw,38px);border-radius:6px;background:#00000010;display:grid;place-items:center;font-style:normal;color:#8a7a68}.cal i.on{background:var(--c);color:#3a2b1d;box-shadow:inset 0 0 0 2px #3a2b1d;animation:pop .6s both}@keyframes pop{from{transform:scale(.3)}}
.ev{list-style:none;margin:10px 0}.ev li{display:grid;grid-template-columns:90px 1fr;gap:8px;padding:6px 0;border-bottom:2px dashed #3a2b1d33;font-size:14px}.ev b{font:700 12px "JetBrains Mono"}.ev .s span{background:#ffd23f;padding:0 4px;font-weight:700}
.mv{color:#e0457b}
.strip{display:flex;gap:10px;overflow-x:auto;padding:12px 0}.ph{flex:0 0 auto;width:min(40vw,150px);background:#fff;padding:6px 6px 22px;border:2px solid #3a2b1d;position:relative}.ph::before{content:"";position:absolute;left:50%;top:-8px;width:44px;height:14px;margin-left:-22px;background:#ffd23faa;transform:rotate(-3deg)}.ph.mm{width:min(28vw,100px)}.ph img{display:block;width:100%;aspect-ratio:1;object-fit:cover}.ph figcaption{font:400 19px "Nanum Pen Script";text-align:center;position:absolute;left:0;right:0;bottom:0}
.grp h3{margin-top:22px;font:900 26px;display:flex;gap:10px;align-items:baseline}.grp h3 em{font:400 22px "Nanum Pen Script";font-style:normal;color:#e0457b}.lede{font-size:14px;margin:6px 0 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,200px),1fr));gap:14px}.card{display:block;text-decoration:none;background:#fff;border:2px solid #3a2b1d;border-radius:12px;overflow:hidden;box-shadow:3px 3px 0 #3a2b1d;transition:.2s}.card:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 #3a2b1d}.card .rc-th{aspect-ratio:4/3}.cap{padding:8px 10px}.cap i{color:#e0457b}.cap b{font-size:15px}
.tg h4{margin:12px 0 4px}.tg span{display:inline-block;background:#fff;border:2px solid #3a2b1d;border-radius:99px;padding:1px 10px;margin:0 5px 5px 0;font-size:13px}.sched{list-style:none}.sched li{display:grid;grid-template-columns:60px 1fr;padding:5px 0;border-bottom:2px dashed #3a2b1d33}.sched b{color:#e0457b;font-family:"JetBrains Mono"}.chartbox{color:#e0457b}
footer{text-align:center;font:400 24px "Nanum Pen Script";padding:20px}[data-r]{transform:translateY(30px) rotate(1deg)}[data-r].in{transform:none}
</style></head><body><div id="app"></div>
<script src="rc.js"></script><script src="dx.js"></script><script>
const {R,story}=DX;
const cal=c=>{const ds=new Set((c.events||[]).map(e=>e.d.replace(/\./g,'-').slice(0,10)));let h='';for(let i=1;i<=28;i++){h+=`<i class="${[...ds].some(d=>+d.slice(8)==i)&&c.events.length?'on':''}" style="animation-delay:${i*30}ms">${i}</i>`}return c.events&&c.events.length?`<div class="cal">${h}</div>`:''};
app.innerHTML=`<header class="cover"><h1>RESCENE<br>DIARY</h1><p>향기로 쓰는 다섯 명의 다이어리 · D+${R.sinceDebut}</p><div class="sts">${DX.statsHTML()}</div></header><main>
${story.map(c=>`<section class="page" data-r style="--c:${c.c[0]}"><div class="mh"><b>${c.title}</b><span>${c.meta}</span></div><div class="pb"><p class="cp">${c.caption}</p>${cal(c)}${DX.body(c)}${DX.mvbars(c)}${DX.ev(c)}${c.photos.length?`<div class="strip">${DX.ph(c)}</div>`:''}${DX.grp(c)}${DX.extra(c)}</div></section>`).join('')}</main><footer>${DX.foot}</footer>`;DX.boot();
</script></body></html>
