<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>리센느 연대기 · Kinetic Timeline</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Pen+Script&family=Pinyon+Script&family=JetBrains+Mono:wght@400;700&family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap">
<style>
*{box-sizing:border-box;margin:0;padding:0}html{overflow-x:hidden;-webkit-text-size-adjust:100%}
:root{--tint:#ffc2dd;--c1:#ffc2dd;--c2:#b9a4ff}
body{overflow-x:clip;background-color:color-mix(in srgb,var(--tint) 13%,#09070d);color:#f5f0fa;font-family:"Noto Sans KR",sans-serif;word-break:keep-all;overflow-wrap:anywhere;transition:background-color 1.4s}
img{max-width:100%}a{color:inherit}
/* HUD */
.hud{position:fixed;left:0;right:0;top:0;z-index:50;display:flex;align-items:center;gap:10px;padding:9px 14px;background:linear-gradient(#09070dee,#09070d00);font:700 11px "JetBrains Mono",monospace;letter-spacing:.08em}
.hud .d{font-size:clamp(18px,4vw,26px);color:var(--tint);min-width:5.4ch}.hud .e{opacity:.85;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.hud .m{opacity:.7}
.hud i{position:absolute;left:0;bottom:0;height:2px;width:calc(var(--sp,0)*100%);background:linear-gradient(90deg,var(--c1),var(--c2))}
/* hero */
.hero{min-height:100svh;display:grid;place-items:center;text-align:center;position:relative;overflow:hidden;padding:70px 14px 40px}
.hero .bgimg{position:absolute;inset:-8%;background:center/cover url(img/g_prettygirl.webp);opacity:.28;filter:saturate(1.2);transform:scale(calc(1 + var(--hp,0)*.25)) translateY(calc(var(--hp,0)*-8vh))}
.hero::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 45%,#0000 20%,#09070d 80%)}
.hero>*{position:relative;z-index:2}
.ring{width:min(78vw,440px);aspect-ratio:1;position:absolute;left:50%;top:50%;margin:calc(min(78vw,440px)/-2) 0 0 calc(min(78vw,440px)/-2);z-index:1;animation:spin 40s linear infinite;opacity:.55}.ring text{font:700 10.6px "JetBrains Mono";fill:#ffc2dd;letter-spacing:.25em}
@keyframes spin{to{transform:rotate(360deg)}}
.title{font:900 clamp(56px,19vw,250px)/.85 "Noto Sans KR";letter-spacing:-.07em;display:block}
.title .ch{display:inline-block;transform:translateY(110%) rotate(8deg);opacity:0;animation:drop .9s cubic-bezier(.2,.9,.2,1) forwards;animation-delay:calc(var(--i)*70ms + .2s);background:linear-gradient(180deg,#fff,var(--c1) 70%,var(--c2));-webkit-background-clip:text;background-clip:text;color:transparent}
@keyframes drop{to{transform:none;opacity:1}}
.title-wrap{overflow:hidden;padding:0 .05em .12em}
.script{font:400 clamp(30px,8vw,76px)/1 "Pinyon Script";color:var(--c1);margin-top:6px;opacity:0;animation:fade 1s 1.2s forwards}@keyframes fade{to{opacity:1}}
.counter{margin-top:26px;font:700 clamp(15px,3vw,20px) "JetBrains Mono";letter-spacing:.2em}.counter b{display:block;font:900 clamp(60px,18vw,170px)/1 "Noto Sans KR";color:var(--c1);letter-spacing:-.05em;font-family:"Noto Sans KR"}
.stats{display:flex;flex-wrap:wrap;gap:10px 28px;justify-content:center;margin-top:18px}.stats div b{display:block;font:700 clamp(18px,4vw,26px) "JetBrains Mono"}.stats span{font-size:11px;opacity:.7}
.scroll{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);font:700 10px "JetBrains Mono";letter-spacing:.3em;opacity:.7;animation:bob 1.6s ease-in-out infinite}@keyframes bob{50%{transform:translate(-50%,8px)}}
/* marquee */
.band{overflow:hidden;white-space:nowrap;border-block:1px solid #ffffff22;padding:6px 0;font:900 clamp(26px,7vw,64px)/1.1 "Noto Sans KR";letter-spacing:-.04em;color:transparent;-webkit-text-stroke:1px color-mix(in srgb,var(--c1) 80%,#fff)}
.band div{display:inline-block;animation:mq 26s linear infinite}.band.rev div{animation-direction:reverse}@keyframes mq{to{transform:translateX(-50%)}}
/* month */
.mon{position:relative;max-width:980px;margin:0 auto;padding:0 14px}
.mon .big{position:sticky;top:46px;height:0;z-index:0;pointer-events:none}
.mon .big b{position:absolute;left:0;top:0;font:900 clamp(120px,40vw,420px)/.8 "Noto Sans KR";letter-spacing:-.08em;color:transparent;-webkit-text-stroke:1.5px color-mix(in srgb,var(--tint) 70%,#fff);opacity:.22;transform:translateX(calc((var(--p,.5) - .5)*-14vw));transition:opacity 1s}
.mon .big i{position:absolute;left:4px;top:-1.4em;font:700 clamp(12px,2.4vw,18px) "JetBrains Mono";font-style:normal;letter-spacing:.4em;opacity:.8}
.mon.in .big b{opacity:.32}
.list{position:relative;z-index:1;padding:clamp(60px,14vw,170px) 0 30px;display:grid;gap:22px}
/* tick */
.tick{display:grid;grid-template-columns:70px 1fr;gap:10px;align-items:baseline;padding:10px 0 10px 16px;border-left:2px solid color-mix(in srgb,var(--tint) 60%,#fff);font-size:clamp(15px,2vw,18px);opacity:0;transform:translateX(-26px);transition:.8s cubic-bezier(.2,.9,.2,1)}
.tick.in{opacity:1;transform:none}.tick b{font:700 12px "JetBrains Mono";color:var(--tint)}.tick.hot{font-weight:900;font-size:clamp(19px,3vw,28px);border-left-width:5px}.tick.future{border-left-style:dashed;opacity:.65}.tick.future::after{content:"UPCOMING";font:700 9px "JetBrains Mono";letter-spacing:.2em;color:var(--tint)}
/* card */
.card{display:block;text-decoration:none;position:relative;max-width:720px;width:100%;transition:transform .5s cubic-bezier(.2,.9,.2,1)}.card:nth-of-type(odd){margin-right:auto}.card:nth-of-type(even){margin-left:auto}
@media(min-width:900px){.card{width:78%}}
.card .media{position:relative;overflow:hidden;clip-path:inset(0 100% 0 0);transition:clip-path 1.1s cubic-bezier(.7,0,.2,1)}.card.in .media{clip-path:inset(0)}
.card .media .rc-th{aspect-ratio:16/10;transform:scale(1.25);transition:transform 1.6s cubic-bezier(.2,.9,.2,1)}.card.in .media .rc-th{transform:none}.card:hover .media .rc-th{transform:scale(1.05)}
.card .chip{position:absolute;left:0;top:0;z-index:4;background:var(--tint);color:#09070d;font:900 11px "JetBrains Mono";padding:4px 10px;letter-spacing:.1em}
.card .txt{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;align-items:start;padding-top:12px}
.card .dd{font:900 clamp(40px,10vw,76px)/.9 "Noto Sans KR";letter-spacing:-.06em;color:var(--tint);grid-row:span 2}
.card h3{font:900 clamp(20px,3.4vw,32px)/1.15 "Noto Sans KR";letter-spacing:-.03em;opacity:0;transform:translateY(16px);transition:.8s .3s}.card p{opacity:0;font-size:14px;line-height:1.6;color:#d9d0e4;transition:.8s .45s}.card.in h3,.card.in p{opacity:1;transform:none}
.card .stat{grid-column:1/-1;font:700 12px "JetBrains Mono";letter-spacing:.2em;color:var(--tint)}
/* era */
.era{position:relative;margin:clamp(60px,14vw,150px) 0 30px;min-height:90svh;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden}
.era .eimg{position:absolute;inset:-10% 0;background:center/cover;transform:scale(calc(1.05 + var(--ep,0)*.18)) translateY(calc((var(--ep,.5) - .5)*-12vh));filter:saturate(1.15)}
.era::before{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(#09070d 0,#09070d00 20%,#09070d99 45%,#09070df2 85%)}
.era>*{position:relative;z-index:2}.era .in-wrap{max-width:980px;margin:0 auto;padding:20px 14px 50px;width:100%}
.era .no{font:700 12px "JetBrains Mono";letter-spacing:.3em;color:var(--c1)}
.era h2{font:900 clamp(54px,17vw,230px)/.86 "Noto Sans KR";letter-spacing:-.07em;margin:8px 0}.era h2 .ch{display:inline-block;transform:translateY(110%);opacity:0;transition:transform .9s cubic-bezier(.2,.9,.2,1),opacity .6s;transition-delay:calc(var(--i)*55ms)}.era.in h2 .ch{transform:none;opacity:1}.era h2 .w{display:inline-block;overflow:hidden;padding-bottom:.12em}
.era h2,.era h2 .w{overflow-wrap:normal;word-break:keep-all}.era .meta{font:700 12px "JetBrains Mono";letter-spacing:.15em;opacity:.85}.era .cap{font:400 clamp(30px,6vw,52px)/1.05 "Nanum Pen Script";color:#ffe3f0;margin:14px 0 8px;max-width:20ch}.era p.b{line-height:1.8;max-width:56ch;margin:6px 0;color:#e9e1f1;font-size:15px}
.scent{position:absolute;right:14px;top:84px;width:clamp(70px,16vw,130px);z-index:3;animation:spin 24s linear infinite}.scent text{font:700 9px "JetBrains Mono";fill:#fff;letter-spacing:.2em}
.mv{display:grid;grid-template-columns:90px 1fr 96px;gap:10px;align-items:center;font:700 12px "JetBrains Mono";margin:7px 0}.mv em{height:7px;background:#ffffff26;display:block}.mv u{display:block;height:100%;width:var(--w);background:linear-gradient(90deg,var(--c1),var(--c2));transform-origin:left;transform:scaleX(0);transition:transform 1.6s cubic-bezier(.2,.9,.2,1)}.era.in .mv u{transform:none}.mv b{text-align:right}
.mem{display:flex;gap:10px;overflow-x:auto;padding:14px 0 6px;scrollbar-width:none}.mem figure{flex:0 0 auto;width:min(31vw,132px);transform:translateY(40px);opacity:0;transition:.9s cubic-bezier(.2,.9,.2,1);transition-delay:calc(var(--i)*90ms)}.era.in .mem figure{transform:none;opacity:1}.mem img{display:block;width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:4px}.mem figcaption{font:700 10px "JetBrains Mono";letter-spacing:.2em;padding-top:5px;text-transform:uppercase;opacity:.85}
/* rank chart */
.rank{border:1px solid #ffffff2a;padding:16px;margin:10px 0;background:#ffffff08;position:relative}.rank .n{font:900 clamp(60px,20vw,160px)/.9 "Noto Sans KR";letter-spacing:-.08em;color:var(--tint)}.rank .t{font:700 11px "JetBrains Mono";letter-spacing:.25em}.rk{width:100%;overflow:visible;margin-top:8px;color:var(--tint)}
.end{min-height:60svh;display:grid;place-items:center;text-align:center;padding:60px 14px 80px}.end h2{font:400 clamp(44px,14vw,140px)/1 "Pinyon Script";color:var(--c1)}.end p{font:700 11px "JetBrains Mono";letter-spacing:.2em;opacity:.7;margin-top:14px}
@media(min-width:900px){.era .eimg{left:auto;right:0;width:50%;inset:0 0 0 auto;transform:scale(calc(1.02 + var(--ep,0)*.08));background-position:center top}.era::before{background:linear-gradient(90deg,#09070d 0,#09070df2 45%,#09070d00 75%)}.era .in-wrap{max-width:none;padding-left:max(24px,calc((100% - 980px)/2));padding-right:54%}.era h2{font-size:clamp(54px,8.5vw,128px)}.era .mem{max-width:100%}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.title .ch{opacity:1;transform:none}.script{opacity:1}.tick,.card h3,.card p,.era h2 .ch,.mem figure{opacity:1;transform:none}.card .media{clip-path:none}.mv u{transform:none}}
</style></head><body>
<div class="hud"><span class="d" id="hd">D+1</span><span class="e" id="he">RESCENE</span><span class="m" id="hm">2024.03</span><i id="hp"></i></div>
<div id="app"></div>
<script src="rc.js"></script><script src="tl.js"></script>
<script>
const HI={prologue:'h_prologue','re-scene':'h_rescene'};
const {R,months,MON}=TL;TL.boot();
const split=t=>t.split(' ').map((w,wi)=>`<span class="w">${[...w].map((c,i)=>`<span class="ch" style="--i:${i+wi*3}">${c}</span>`).join('')}</span>`).join(' ');
const bandText=(t)=>(`${t} ✱ `).repeat(10);
const scentRing=c=>c.scent?`<svg class="scent" viewBox="0 0 100 100"><defs><path id="sp${c.n}" d="M50 50m-40 0a40 40 0 1 1 80 0a40 40 0 1 1-80 0"/></defs><text><textPath href="#sp${c.n}">${c.scent[1].toUpperCase()} ✱ ${c.scent[0]} ✱ ${c.scent[1].toUpperCase()} ✱</textPath></text></svg>`:'';
const mvs=c=>(c.mvs||[]).map(m=>`<div class="mv"><span>${m.n}</span><em><u style="--w:${(m.v/R.mvMax*100).toFixed(1)}%"></u></em><b data-count="${m.v}">0</b></div>`).join('');
const eraHTML=i=>{const c=i.ch;return `<section class="era" data-iso="${i.iso}" data-ch="${c.id}" style="--c1:${c.c[0]};--c2:${c.c[1]}"><div class="eimg" style="background-image:url(${R.img(HI[c.id]||c.group)})"></div>${scentRing(c)}
<div class="band rev"><div>${bandText(c.title)}</div></div><div class="in-wrap"><div class="no">N°${c.n} · ${R.fd(i.iso)}</div><h2>${split(c.title)}</h2><div class="meta">${c.meta}</div><p class="cap">${c.caption}</p>${(c.body||[]).map(p=>`<p class="b">${p}</p>`).join('')}${mvs(c)}<div class="mem">${(c.mem||[]).map((m,k)=>`<figure style="--i:${k}"><img src="${R.img(m.img)}" alt="" decoding="async"><figcaption>${m.en}</figcaption></figure>`).join('')}</div></div></section>`};
const cardHTML=i=>R.wrapLink(i,'card',`<div class="media"><span class="chip">${i.secKr}${i.tag&&i.tag!==i.secKr?' · '+i.tag:''}</span>${R.thumb(i)}</div><div class="txt"><span class="dd">${R.md(i.iso.endsWith('-00')?i.iso.slice(0,7)+'-01':i.iso).slice(i.iso.endsWith('-00')?0:3)||''}</span><h3>${i.title}</h3><p>${i.p||''}</p>${i.stat?`<span class="stat">${i.stat}</span>`:''}</div>`).replace('class="card"','class="card" data-iso="'+i.iso+'"');
const tickHTML=i=>`<div class="tick ${i.hot?'hot':''} ${i.future?'future':''}" data-iso="${i.iso}"><b>${R.md(i.iso).replace('.00','')}</b><span>${i.title}</span></div>`;
const rankHTML=()=>{const w=520,h=170,{pts}=R.chartPath(w,h,26);const d=pts.map((p,k)=>(k?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');return `<div class="rank card-like" id="rank"><div class="t">MELON TOP100 · LOVE ATTACK</div><div class="n" id="rn">28</div><svg class="rk" viewBox="0 0 ${w} ${h}"><path id="rp" d="${d}" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/>${R.chart.map((c,k)=>`<circle cx="${pts[k][0]}" cy="${pts[k][1]}" r="5" fill="currentColor"/><text x="${pts[k][0]}" y="${pts[k][1]+(c.r<3?-12:22)}" text-anchor="middle" fill="#fff" font-size="12" font-family="JetBrains Mono">${R.md(c.d)} ${c.l}</text>`).join('')}</svg></div>`};
const monHTML=m=>`<section class="mon" data-m="${m.key}"><div class="big"><i>${m.y}</i><b>${String(m.mo).padStart(2,'0')}</b></div></section>`;
let html=`<header class="hero"><div class="bgimg" id="hbg"></div><svg class="ring" viewBox="0 0 100 100"><defs><path id="hr" d="M50 50m-42 0a42 42 0 1 1 84 0a42 42 0 1 1-84 0"/></defs><text><textPath href="#hr">SCENE + SCENT ✱ ${R.members.map(m=>m.en).join(' ✱ ')} ✱ SINCE 2024.03.26 ✱</textPath></text></svg>
<div><div class="title-wrap"><span class="title">${[...'RESCENE'].map((c,i)=>`<span class="ch" style="--i:${i}">${c}</span>`).join('')}</span></div><div class="script">a chronicle of scents</div><div class="counter">DEBUT +<b data-count="${R.sinceDebut}" data-dur="2600">0</b>DAYS</div><div class="stats">${R.stats.slice(1).map(s=>`<div><b data-count="${s.v}" data-suf="${s.suf}">0</b><span>${s.l}</span></div>`).join('')}</div></div><div class="scroll">SCROLL ↓</div></header>
<div class="band"><div>${bandText('SCENE + SCENT')}</div></div>`;
const tmp=document.createElement('div');
months.forEach(m=>{let inner=m.items.map(i=>i.type==='era'?'':i.type==='card'?cardHTML(i):i.type==='tick'?tickHTML(i):'').join('');
 const eras=m.items.filter(i=>i.type==='era');
 let pre=eras.map(eraHTML).join('');
 let body=`<section class="mon" data-m="${m.key}" data-y="${m.y}" data-mo="${m.mo}"><div class="big"><i>${m.y}</i><b>${String(m.mo).padStart(2,'0')}</b></div><div class="list">${m.key==='2026-06'?rankHTML():''}${inner}</div></section>`;
 html+=pre+(inner||m.key==='2026-06'?body:'');});
html+=`<footer class="end"><div><h2>to be continued</h2><p>NEXT SCENE · PULSE · 2026.11.03</p></div></footer>`;
app.innerHTML=html;
// reveal
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{threshold:.12,rootMargin:'0px 0px -6% 0px'});
document.querySelectorAll('.tick,.card,.era,.mon').forEach(e=>io.observe(e));R.counts();
if(R.reduce){document.querySelectorAll('.tick,.card,.era,.mon').forEach(e=>e.classList.add('in'))}
// scroll engine
const hd=document.getElementById('hd'),he=document.getElementById('he'),hm=document.getElementById('hm'),hp=document.getElementById('hp'),hbg=document.getElementById('hbg');
const marks=[...document.querySelectorAll('[data-iso]')],mons=[...document.querySelectorAll('.mon')],eras=[...document.querySelectorAll('.era')];
const rp=document.getElementById('rp'),rn=document.getElementById('rn'),rank=document.getElementById('rank');
let shown=1,target=1;const hex=h=>h;
function tick(){shown+=(target-shown)*.14;if(Math.abs(target-shown)<.5)shown=target;hd.textContent='D+'+Math.round(shown);requestAnimationFrame(tick)}tick();
R.onScroll((y,p)=>{hp.style.setProperty('--sp',p);hbg.style.setProperty('--hp',Math.min(1,y/innerHeight));
 let cur=null;for(const m of marks){if(m.getBoundingClientRect().top<innerHeight*.5)cur=m;else break}
 if(cur){const iso=cur.dataset.iso;target=TL.dplus(iso);const ch=TL.eraAt(iso);document.documentElement.style.setProperty('--tint',ch.c[0]);document.documentElement.style.setProperty('--c1',ch.c[0]);document.documentElement.style.setProperty('--c2',ch.c[1]);he.textContent=`N°${ch.n} ${ch.title}`;hm.textContent=iso.slice(0,7).replace('-','.')}
 mons.forEach(m=>m.style.setProperty('--p',R.prog(m).toFixed(3)));eras.forEach(e=>e.style.setProperty('--ep',R.prog(e).toFixed(3)));
 if(rank){const k=Math.min(1,Math.max(0,(innerHeight*.9-rank.getBoundingClientRect().top)/(innerHeight*.6)));rp.style.strokeDashoffset=1-k;rn.textContent=Math.max(1,Math.round(28-k*27))}
});
</script></body></html>
