<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RESCENE ARCHIVE | NEWS</title>
    <meta name="description" content="RESCENE(리센느) 관련 뉴스 모아보기">
    <link rel="icon" type="image/png" href="../images/logo.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@200;300;400;600;800;900&family=Noto+Sans+KR:wght@200;300;400;500;700&family=Plus+Jakarta+Sans:wght@300;400;500;700&family=Gaegu:wght@400;700&family=Nanum+Pen+Script&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/index.css">
    <link rel="stylesheet" href="../css/modal.css">
    <link rel="stylesheet" href="news.css">

    <script src="../js/theme-init.js"></script>
</head>
<body>

    <div id="siteNavSlot"></div>
    <script src="../js/layout.js"></script>
    <script>renderSiteNav('news', '../', { calendar: true, lang: true });</script>

    <div id="mainWrapper" style="padding-top: 120px; min-height: 100vh; display: flex; flex-direction: column;">
        <div class="section-container news-page-container" style="flex: 1;">
            <div class="section-header">
                <div class="section-title" data-i18n="newsTitle">RESCENE <span>NEWS</span></div>
            </div>

            <div class="news-list" id="newsGrid"></div>
            <div class="news-empty" id="newsEmpty" style="display:none;" data-i18n="newsEmpty">아직 등록된 기사가 없습니다.</div>
        </div>

        <div id="siteFooterSlot"></div>
        <script>renderSiteFooter('../');</script>
    </div>

    <script>var SITE_ROOT = '../';</script>
    <script src="../js/i18n.js"></script>
    <script src="../js/member_data.js"></script>
    <script src="../js/common.js"></script>
    <script src="news_data.js"></script>
    <script src="news.js"></script>

    <div id="siteCalendarSlot"></div>
    <script>renderCalendarWidgets();</script>

    <!-- 기사 클릭 시 오른쪽에서 열리는 뉴스 모달 -->
    <div class="modal-backdrop" id="newsModalBackdrop" onclick="closeNewsModal()"></div>
    <div class="modal-wrapper news-modal-wrapper" id="newsModalWrapper">
        <button class="popup-close-btn" onclick="closeNewsModal()" aria-label="닫기">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
        <div class="news-modal-inner">
            <div class="news-modal-head" id="newsModalHead"></div>
            <div class="news-modal-scroll">
                <div class="news-modal-thumb" id="newsModalThumb"></div>
                <p class="news-modal-summary" id="newsModalSummaryText" style="display:none;"></p>

                <a id="newsModalOpenOriginal" href="#" target="_blank" rel="noopener noreferrer" class="news-modal-primary-btn">
                    <span data-i18n="newsModalOpenOriginal">원문에서 전체 기사 보기 →</span>
                </a>

                <button type="button" class="news-modal-inline-toggle" id="newsModalInlineToggle" onclick="nwToggleInlinePreview()">
                    <span data-i18n="newsModalInlineToggleShow">사이트 안에서 미리보기 시도</span> <span class="news-modal-inline-caret">▾</span>
                </button>

                <div class="news-modal-frame-wrap" id="newsModalFrameWrap" style="display:none;">
                    <iframe id="newsModalFrame" class="news-modal-iframe" title="기사 미리보기" referrerpolicy="no-referrer" sandbox="allow-scripts allow-same-origin allow-popups allow-forms allow-top-navigation-by-user-activation"></iframe>
                    <div class="news-modal-loading" id="newsModalLoading" data-i18n="newsModalLoading">기사를 불러오는 중...</div>
                    <div class="news-modal-frame-fallback" id="newsModalFrameFallback" style="display:none;" data-i18n="newsModalFallbackMsg">이 언론사는 보안 정책상 미리보기를 지원하지 않아요. 위의 버튼으로 원문에서 확인해주세요.</div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
